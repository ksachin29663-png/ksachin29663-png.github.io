<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pro Video Editor - Sachin AI Studio</title>
<link rel="icon" href="/favicon.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3019468976412219" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;--border:#2a2a2a;
  --accent:#ff4d6d;--blue:#4361ee;--green:#06d6a0;--yellow:#ffd60a;
  --text:#f0f0f0;--muted:#888;--white:#fff;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

/* ── TOP BAR ── */
.topbar{height:52px;background:#000;display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;border-bottom:1px solid #222;z-index:200;position:relative;}
.btn-back{color:var(--text);background:none;border:none;font-size:1.3rem;cursor:pointer;padding:6px;line-height:1;}
.topbar-title{flex:1;font-size:.85rem;font-weight:700;color:var(--white);}
.topbar-title span{color:var(--accent);}
.btn-undo,.btn-redo{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:6px;transition:.2s;}
.btn-undo:hover,.btn-redo:hover{color:var(--white);}
.btn-export{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:.8rem;font-weight:700;cursor:pointer;transition:.2s;}
.btn-export:hover{background:#ff2d55;transform:scale(1.03);}

/* ── MAIN CONTAINER ── */
.editor-wrap{display:flex;flex-direction:column;height:calc(100vh - 52px);}

/* ── VIDEO PREVIEW ── */
.preview-area{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden;min-height:0;}
.canvas-wrap{position:relative;display:inline-block;max-width:100%;max-height:100%;}
#mainCanvas{display:block;max-width:100%;max-height:100%;border-radius:4px;}
.preview-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.play-big-btn{width:64px;height:64px;background:rgba(0,0,0,.55);border-radius:50%;border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;pointer-events:all;transition:.2s;backdrop-filter:blur(4px);}
.play-big-btn:hover{background:rgba(255,77,109,.7);border-color:var(--accent);}
.no-video-msg{text-align:center;color:var(--muted);pointer-events:none;}
.no-video-msg .icon{font-size:3rem;margin-bottom:8px;}
.no-video-msg p{font-size:.85rem;}

/* ── TIME INFO ── */
.time-bar{height:28px;background:#000;display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;}
.time-txt{font-size:.72rem;color:var(--muted);font-family:monospace;min-width:80px;}
.progress-track{flex:1;height:3px;background:#333;border-radius:3px;cursor:pointer;position:relative;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:.05s;}
.progress-thumb{position:absolute;top:50%;right:0;width:12px;height:12px;background:#fff;border-radius:50%;transform:translate(50%,-50%);box-shadow:0 0 6px rgba(255,77,109,.8);}

/* ── TIMELINE ── */
.timeline-area{height:80px;background:#0d0d0d;border-top:1px solid #222;display:flex;align-items:center;padding:0 8px;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.timeline-area::-webkit-scrollbar{display:none;}
.add-clip-btn{width:60px;height:58px;background:var(--panel2);border:2px dashed #444;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:1.4rem;color:#666;transition:.2s;gap:2px;}
.add-clip-btn:hover{border-color:var(--accent);color:var(--accent);}
.add-clip-btn span{font-size:.55rem;}
.clip-item{height:58px;min-width:80px;background:linear-gradient(135deg,#1e2a3a,#0f1923);border-radius:8px;border:2px solid #333;flex-shrink:0;position:relative;cursor:pointer;overflow:hidden;transition:.2s;}
.clip-item.active{border-color:var(--accent);}
.clip-thumb{width:100%;height:100%;object-fit:cover;border-radius:6px;}
.clip-dur{position:absolute;bottom:3px;right:5px;font-size:.55rem;background:rgba(0,0,0,.7);padding:1px 4px;border-radius:3px;color:#ddd;}
.clip-del{position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--accent);border-radius:50%;font-size:.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;}
.clip-item:hover .clip-del{opacity:1;}

/* ── PLAY CONTROLS ── */
.play-controls{height:48px;background:#000;display:flex;align-items:center;justify-content:center;gap:18px;flex-shrink:0;border-top:1px solid #1a1a1a;}
.ctrl-btn{background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer;padding:6px;transition:.2s;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:hover{color:var(--accent);}
.ctrl-btn.play-pause{width:40px;height:40px;background:var(--accent);border-radius:50%;font-size:1rem;color:#fff;}
.ctrl-btn.play-pause:hover{background:#ff2d55;transform:scale(1.07);}

/* ── BOTTOM TOOLBAR ── */
.bottom-toolbar{background:#000;border-top:1px solid #222;padding:6px 0 8px;flex-shrink:0;}
.toolbar-scroll{display:flex;overflow-x:auto;gap:0;padding:0 8px;scrollbar-width:none;}
.toolbar-scroll::-webkit-scrollbar{display:none;}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 14px;cursor:pointer;border:none;background:none;flex-shrink:0;border-radius:8px;transition:.15s;min-width:68px;}
.tool-btn:hover{background:rgba(255,255,255,.05);}
.tool-btn.active{background:rgba(255,77,109,.12);}
.tool-btn .t-icon{font-size:1.3rem;line-height:1;}
.tool-btn .t-label{font-size:.6rem;color:var(--muted);white-space:nowrap;}
.tool-btn.active .t-label{color:var(--accent);}
.tool-btn.active .t-icon{filter:drop-shadow(0 0 4px var(--accent));}

/* ── TOOL PANEL (slides up) ── */
.tool-panel{display:none;background:var(--panel);border-top:1px solid #333;max-height:220px;overflow:hidden;}
.tool-panel.open{display:block;}
.tp-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #222;}
.tp-title{font-size:.78rem;font-weight:700;color:var(--white);}
.tp-close{background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:2px 6px;}
.tp-body{overflow-y:auto;max-height:170px;padding:10px 12px;}

/* Filter strip */
.filter-strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none;}
.filter-strip::-webkit-scrollbar{display:none;}
.fitem{flex-shrink:0;text-align:center;cursor:pointer;transition:.2s;}
.fitem-thumb{width:64px;height:64px;border-radius:10px;border:2px solid transparent;overflow:hidden;position:relative;background:#1a1a1a;}
.fitem-thumb canvas{width:100%;height:100%;border-radius:8px;}
.fitem.active .fitem-thumb{border-color:var(--accent);box-shadow:0 0 8px rgba(255,77,109,.5);}
.fitem-name{font-size:.6rem;color:var(--muted);margin-top:4px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fitem.active .fitem-name{color:var(--accent);}

/* Adjust sliders */
.adj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.adj-row label{font-size:.68rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px;}
.adj-val{color:var(--accent);font-weight:700;}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;background:linear-gradient(to right,var(--accent) var(--pct,50%),#333 var(--pct,50%));border-radius:3px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--white);box-shadow:0 0 5px rgba(255,77,109,.7);cursor:pointer;}

/* Enhance buttons */
.enhance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.enh-btn{padding:10px 6px;background:var(--panel2);border:1px solid #333;border-radius:10px;color:var(--text);cursor:pointer;font-size:.65rem;text-align:center;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.enh-btn .ei{font-size:1.3rem;}
.enh-btn:hover,.enh-btn.active{border-color:var(--green);color:var(--green);background:rgba(6,214,160,.08);}
.enh-btn.active{background:rgba(6,214,160,.15);}

/* Speed buttons */
.speed-row{display:flex;gap:8px;flex-wrap:wrap;}
.spd-btn{padding:8px 16px;border-radius:20px;border:1px solid #333;background:var(--panel2);color:var(--text);cursor:pointer;font-size:.72rem;font-weight:700;transition:.2s;}
.spd-btn:hover,.spd-btn.active{border-color:var(--yellow);color:var(--yellow);background:rgba(255,214,10,.08);}

/* Text panel */
.text-inputs{display:flex;flex-direction:column;gap:8px;}
.ti{width:100%;background:var(--panel2);border:1px solid #333;color:var(--text);padding:8px 12px;border-radius:8px;font-size:.8rem;outline:none;}
.ti:focus{border-color:var(--accent);}
.font-sizes{display:flex;gap:6px;flex-wrap:wrap;}
.fs-btn{padding:4px 10px;border-radius:6px;border:1px solid #333;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:.65rem;}
.fs-btn.active{border-color:var(--accent);color:var(--accent);}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.col-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s;}
.col-dot:hover,.col-dot.active{border-color:#fff;transform:scale(1.15);}

/* Sticker grid */
.sticker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.stk-btn{font-size:1.5rem;text-align:center;cursor:pointer;padding:4px;border-radius:6px;transition:.2s;}
.stk-btn:hover{background:rgba(255,255,255,.1);transform:scale(1.2);}

/* Effect grid */
.effect-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none;}
.effect-scroll::-webkit-scrollbar{display:none;}
.efx-btn{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid #333;background:var(--panel2);color:var(--text);cursor:pointer;font-size:.68rem;font-weight:700;transition:.2s;white-space:nowrap;}
.efx-btn:hover,.efx-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(67,97,238,.1);}

/* Transition grid */
.trans-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none;}
.trans-scroll::-webkit-scrollbar{display:none;}
.trans-btn{flex-shrink:0;width:72px;height:56px;border-radius:10px;border:1px solid #333;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:.62rem;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.2s;}
.trans-btn:hover,.trans-btn.active{border-color:var(--yellow);color:var(--yellow);}
.trans-btn .ti2{font-size:1.1rem;}

/* Crop panel */
.crop-btns{display:flex;gap:8px;flex-wrap:wrap;}
.crop-btn{padding:7px 14px;border-radius:8px;border:1px solid #333;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:.68rem;font-weight:700;transition:.2s;}
.crop-btn:hover,.crop-btn.active{border-color:var(--accent);color:var(--accent);}

/* Audio panel */
.audio-row{display:flex;flex-direction:column;gap:8px;}
.audio-btn-row{display:flex;gap:8px;}
.audio-action{flex:1;padding:9px;border-radius:8px;border:1px solid #333;background:var(--panel2);color:var(--text);cursor:pointer;font-size:.68rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;}
.audio-action:hover{border-color:var(--green);color:var(--green);}
.audio-action .ai2{font-size:1.2rem;}

/* Beauty panel */
.beauty-sliders{display:flex;flex-direction:column;gap:10px;}

/* LUT grid */
.lut-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none;}
.lut-scroll::-webkit-scrollbar{display:none;}
.lut-item{flex-shrink:0;width:70px;text-align:center;cursor:pointer;}
.lut-thumb{width:70px;height:50px;border-radius:8px;border:2px solid transparent;overflow:hidden;font-size:1.8rem;display:flex;align-items:center;justify-content:center;}
.lut-item.active .lut-thumb{border-color:var(--accent);}
.lut-name{font-size:.6rem;color:var(--muted);margin-top:3px;}
.lut-item.active .lut-name{color:var(--accent);}

/* Notification toast */
.toast{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);background:rgba(6,214,160,.9);color:#000;padding:8px 18px;border-radius:20px;font-size:.78rem;font-weight:700;opacity:0;transition:.3s;z-index:999;pointer-events:none;}
.toast.show{opacity:1;}

/* File input hidden */
#fileInput{display:none;}

/* Scrollbar for panels */
.tp-body::-webkit-scrollbar{width:3px;}
.tp-body::-webkit-scrollbar-thumb{background:#333;}

/* Active filter overlay */
.filter-overlay{position:absolute;inset:0;border-radius:4px;pointer-events:none;}

/* Beauty overlay */
.beauty-overlay{position:absolute;inset:0;border-radius:4px;pointer-events:none;background:transparent;}

/* Cinematic bars */
.cin-bar-top,.cin-bar-bot{position:absolute;left:0;right:0;height:0;background:#000;transition:.3s;pointer-events:none;}
.cin-bar-top{top:0;}
.cin-bar-bot{bottom:0;}

@media(max-width:480px){
  .adj-grid{grid-template-columns:1fr;}
  .enhance-grid{grid-template-columns:repeat(3,1fr);}
  .tool-btn{min-width:58px;padding:6px 10px;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <button class="btn-back" onclick="window.location='/'">←</button>
  <div class="topbar-title">🎬 <span>Pro</span> Video Editor</div>
  <button class="btn-undo ctrl-btn" id="btnUndo" title="Undo">↩</button>
  <button class="btn-redo ctrl-btn" id="btnRedo" title="Redo">↪</button>
  <button class="btn-export" onclick="exportVideo()">Export ↗</button>
</div>

<div class="editor-wrap">

  <!-- VIDEO PREVIEW -->
  <div class="preview-area" id="previewArea">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mainCanvas" width="1280" height="720"></canvas>
      <div class="cin-bar-top" id="cinTop"></div>
      <div class="cin-bar-bot" id="cinBot"></div>
      <div class="preview-overlay" id="previewOverlay">
        <div class="no-video-msg" id="noVideoMsg">
          <div class="icon">🎬</div>
          <p>नीचे <strong>+ Add</strong> दबाएं और Video चुनें</p>
          <p style="margin-top:6px;font-size:.75rem;">Video, Image या Multi-clip add करें</p>
        </div>
        <button class="play-big-btn" id="playBigBtn" style="display:none" onclick="togglePlay()">▶</button>
      </div>
    </div>
  </div>

  <!-- TIME BAR -->
  <div class="time-bar">
    <span class="time-txt" id="timeTxt">0:00 / 0:00</span>
    <div class="progress-track" id="progressTrack" onclick="seekTo(event)">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
      <div class="progress-thumb" id="progressThumb" style="left:0%"></div>
    </div>
  </div>

  <!-- TIMELINE -->
  <div class="timeline-area" id="timelineArea">
    <div class="add-clip-btn" onclick="document.getElementById('fileInput').click()">
      <span>➕</span><span>Add</span>
    </div>
    <!-- clips injected here -->
  </div>

  <!-- PLAY CONTROLS -->
  <div class="play-controls">
    <button class="ctrl-btn" onclick="skipTime(-5)" title="Rewind">⏮</button>
    <button class="ctrl-btn" onclick="skipTime(-1)" title="-1s">⏪</button>
    <button class="ctrl-btn play-pause" id="playPauseBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="skipTime(1)" title="+1s">⏩</button>
    <button class="ctrl-btn" onclick="skipTime(5)" title="Forward">⏭</button>
    <button class="ctrl-btn" onclick="toggleMute()" id="muteBtn" title="Mute">🔊</button>
  </div>

  <!-- TOOL PANEL -->
  <div class="tool-panel" id="toolPanel">
    <div class="tp-header">
      <span class="tp-title" id="panelTitle">Filter</span>
      <button class="tp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="tp-body" id="panelBody"></div>
  </div>

  <!-- BOTTOM TOOLBAR -->
  <div class="bottom-toolbar">
    <div class="toolbar-scroll" id="toolbarScroll">
      <button class="tool-btn" data-panel="filter" onclick="openPanel('filter')">
        <span class="t-icon">🎨</span><span class="t-label">Filter</span>
      </button>
      <button class="tool-btn" data-panel="adjust" onclick="openPanel('adjust')">
        <span class="t-icon">🎛️</span><span class="t-label">Adjust</span>
      </button>
      <button class="tool-btn" data-panel="enhance" onclick="openPanel('enhance')">
        <span class="t-icon">✨</span><span class="t-label">Enhance</span>
      </button>
      <button class="tool-btn" data-panel="effect" onclick="openPanel('effect')">
        <span class="t-icon">⚡</span><span class="t-label">Effect</span>
      </button>
      <button class="tool-btn" data-panel="text" onclick="openPanel('text')">
        <span class="t-icon">T</span><span class="t-label">Text</span>
      </button>
      <button class="tool-btn" data-panel="sticker" onclick="openPanel('sticker')">
        <span class="t-icon">😄</span><span class="t-label">Sticker</span>
      </button>
      <button class="tool-btn" data-panel="audio" onclick="openPanel('audio')">
        <span class="t-icon">🎵</span><span class="t-label">Audio</span>
      </button>
      <button class="tool-btn" data-panel="speed" onclick="openPanel('speed')">
        <span class="t-icon">⚙️</span><span class="t-label">Speed</span>
      </button>
      <button class="tool-btn" data-panel="transition" onclick="openPanel('transition')">
        <span class="t-icon">🔀</span><span class="t-label">Transition</span>
      </button>
      <button class="tool-btn" data-panel="lut" onclick="openPanel('lut')">
        <span class="t-icon">🌈</span><span class="t-label">LUT Grade</span>
      </button>
      <button class="tool-btn" data-panel="beauty" onclick="openPanel('beauty')">
        <span class="t-icon">💄</span><span class="t-label">Beauty</span>
      </button>
      <button class="tool-btn" data-panel="crop" onclick="openPanel('crop')">
        <span class="t-icon">✂️</span><span class="t-label">Crop</span>
      </button>
      <button class="tool-btn" data-panel="pip" onclick="openPanel('pip')">
        <span class="t-icon">🖼️</span><span class="t-label">PiP</span>
      </button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="video/*,image/*" multiple onchange="handleFiles(event)">
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
const state = {

const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
const FILTER_CATEGORIES = {

// Filter CSS generators
function filterCSS(name) {
  const n = name.toLowerCase();
  // Instagram-style
  if(n.includes('clarendon')) return 'contrast(1.2) saturate(1.35)';
  if(n.includes('gingham')) return 'brightness(1.05) hue-rotate(-10deg)';
  if(n.includes('moon')) return 'grayscale(.6) contrast(1.1) brightness(1.1)';
  if(n.includes('lark')) return 'brightness(1.08) contrast(.9) saturate(1.4)';
  if(n.includes('reyes')) return 'brightness(1.1) contrast(.85) saturate(.75) sepia(.22)';
  if(n.includes('juno')) return 'saturate(1.4) contrast(1.15)';
  if(n.includes('slumber')) return 'brightness(1.05) saturate(.66) sepia(.35)';
  if(n.includes('crema')) return 'saturate(.5) contrast(1.2) sepia(.3) hue-rotate(10deg)';
  if(n.includes('ludwig')) return 'brightness(1.05) saturate(1.25)';
  if(n.includes('aden')) return 'brightness(1.2) saturate(.85) hue-rotate(-20deg)';
  if(n.includes('perpetua')) return 'contrast(1.05) saturate(1.1)';
  if(n.includes('amaro')) return 'brightness(1.1) contrast(.9) saturate(1.5) hue-rotate(-10deg)';
  if(n.includes('mayfair')) return 'contrast(1.1) saturate(1.1) sepia(.1)';
  if(n.includes('rise')) return 'brightness(1.09) sepia(.3) contrast(.9) saturate(.9)';
  if(n.includes('hudson')) return 'brightness(1.2) contrast(.9) saturate(1.1)';
  if(n.includes('valencia')) return 'brightness(1.08) contrast(1.08) saturate(1.08) sepia(.08)';
  if(n.includes('x pro')) return 'sepia(.45) contrast(1.25) saturate(1.75)';
  if(n.includes('sierra')) return 'sepia(.25) contrast(1.25) brightness(1.1) saturate(1.35)';
  if(n.includes('willow')) return 'grayscale(.5) contrast(1.2) brightness(1.1)';
  if(n.includes('lo-fi')) return 'saturate(1.8) contrast(1.15)';
  if(n.includes('earlybird')) return 'sepia(.4) contrast(.9) brightness(1)';
  if(n.includes('brannan')) return 'sepia(.5) contrast(1.4)';
  if(n.includes('inkwell')) return 'grayscale(1) contrast(1.1)';
  if(n.includes('walden')) return 'brightness(1.1) hue-rotate(-10deg) saturate(1.6) sepia(.2)';
  if(n.includes('hefe')) return 'saturate(1.5) contrast(1.4)';
  if(n.includes('nashville')) return 'sepia(.25) contrast(1.5) brightness(.9) saturate(1.2)';
  if(n.includes('1977')) return 'contrast(1.1) brightness(1.1) saturate(1.3) sepia(.3)';
  if(n.includes('kelvin')) return 'brightness(1.1) saturate(1.5) sepia(.4) hue-rotate(-10deg)';
  if(n.includes('toaster')) return 'sepia(.5) contrast(1.5) brightness(0.9)';
  if(n.includes('sutro')) return 'sepia(.4) saturate(1.2) contrast(1.2) brightness(.9)';
  // Cinematic
  if(n.includes('hollywood')) return 'contrast(1.3) saturate(.8) brightness(1.05)';
  if(n.includes('blockbuster')) return 'contrast(1.25) saturate(1.2) brightness(1.1)';
  if(n.includes('film noir')) return 'grayscale(.8) contrast(1.5) brightness(.8)';
  if(n.includes('epic')) return 'contrast(1.3) saturate(1.4) brightness(1.05)';
  if(n.includes('drama')) return 'contrast(1.2) saturate(.9) brightness(.95)';
  if(n.includes('thriller')) return 'contrast(1.3) saturate(.7) brightness(.9)';
  if(n.includes('action')) return 'contrast(1.35) saturate(1.3) brightness(1.05)';
  if(n.includes('romantic')) return 'brightness(1.1) saturate(1.2) sepia(.2)';
  if(n.includes('dark knight')) return 'contrast(1.4) saturate(.6) brightness(.85)';
  if(n.includes('inception')) return 'contrast(1.15) saturate(.85) brightness(.95)';
  if(n.includes('matrix')) return 'sepia(1) hue-rotate(100deg) saturate(3) brightness(.8)';
  if(n.includes('avatar')) return 'hue-rotate(-20deg) saturate(1.5) brightness(1.1)';
  if(n.includes('joker')) return 'hue-rotate(10deg) saturate(1.3) contrast(1.2)';
  if(n.includes('oppenheimer')) return 'sepia(.4) contrast(1.2) brightness(.9)';
  if(n.includes('barbie')) return 'hue-rotate(-30deg) saturate(2) brightness(1.1)';
  // Film
  if(n.includes('kodak')) return 'sepia(.2) contrast(1.1) saturate(1.15) brightness(1.05)';
  if(n.includes('fuji')) return 'hue-rotate(5deg) saturate(1.2) brightness(1.1)';
  if(n.includes('ilford')) return 'grayscale(.9) contrast(1.2) brightness(1.05)';
  if(n.includes('cinestill')) return 'sepia(.3) contrast(1.15) saturate(.9) brightness(.9)';
  // Vintage
  if(n.includes('vhs')) return 'contrast(1.2) saturate(1.5) brightness(.9) hue-rotate(10deg)';
  if(n.includes('polaroid')) return 'contrast(.9) brightness(1.1) saturate(.8) sepia(.3)';
  if(n.includes('sepia')) return 'sepia(1) contrast(1.1)';
  if(n.includes('retro')) return 'sepia(.5) contrast(1.1) saturate(.8)';
  if(n.includes('aged')) return 'sepia(.6) brightness(.9) contrast(1.1)';
  if(n.includes('faded')) return 'brightness(1.15) saturate(.7) contrast(.85)';
  // Neon
  if(n.includes('neon pink')) return 'saturate(2) hue-rotate(-30deg) brightness(1.1)';
  if(n.includes('neon blue')) return 'saturate(2) hue-rotate(190deg) brightness(1.1)';
  if(n.includes('neon green')) return 'saturate(2) hue-rotate(130deg) brightness(1.1)';
  if(n.includes('neon purple')) return 'saturate(2) hue-rotate(250deg) brightness(1.1)';
  if(n.includes('cyberpunk')) return 'hue-rotate(200deg) saturate(2) contrast(1.3) brightness(.9)';
  if(n.includes('synthwave')) return 'hue-rotate(240deg) saturate(1.8) contrast(1.2)';
  if(n.includes('vaporwave')) return 'hue-rotate(280deg) saturate(1.6) brightness(1.1)';
  // B&W
  if(n.includes('bw') || n.includes('b&w') || n.includes('grayscale') || n.includes('black')) return 'grayscale(1) contrast(1.1)';
  if(n.includes('silver')) return 'grayscale(1) brightness(1.1) contrast(1.05)';
  if(n.includes('platinum')) return 'grayscale(1) brightness(1.2) contrast(.9)';
  // Nature
  if(n.includes('golden hour')) return 'sepia(.4) saturate(1.5) brightness(1.15) hue-rotate(-10deg)';
  if(n.includes('blue hour')) return 'sepia(0) hue-rotate(200deg) saturate(1.3) brightness(.85)';
  if(n.includes('aurora')) return 'hue-rotate(120deg) saturate(1.5) brightness(1.1)';
  // Horror
  if(n.includes('horror')) return 'saturate(1.8) contrast(1.3) hue-rotate(10deg) brightness(.85)';
  if(n.includes('blood')) return 'hue-rotate(350deg) saturate(2) contrast(1.3)';
  // Bollywood
  if(n.includes('bollywood')) return 'saturate(1.8) contrast(1.15) brightness(1.1) hue-rotate(5deg)';
  if(n.includes('filmi')) return 'saturate(2) contrast(1.2) brightness(1.05)';
  if(n.includes('masala')) return 'saturate(1.6) contrast(1.2) hue-rotate(15deg)';
  if(n.includes('desi')) return 'sepia(.2) saturate(1.5) contrast(1.15)';
  if(n.includes('mumbai')) return 'hue-rotate(-10deg) saturate(1.4) contrast(1.2)';
  // Sports
  if(n.includes('action cam')) return 'contrast(1.3) saturate(1.4) brightness(1.1)';
  // Generate unique filter based on name hash
  let hash = 0;
  for(let c of name) hash = (hash * 31 + c.charCodeAt(0)) & 0xffffffff;
  const br = 0.85 + ((hash & 0x1f) / 100);
  const co = 0.85 + (((hash>>5) & 0x3f) / 100);
  const sa = 0.6 + (((hash>>11) & 0x7f) / 100);
  const hu = (hash>>18) & 0x1ff;
  const se = ((hash>>27) & 0x0f) / 40;
  return `brightness(${br.toFixed(2)}) contrast(${co.toFixed(2)}) saturate(${sa.toFixed(2)}) hue-rotate(${hu}deg) sepia(${se.toFixed(2)})`;
}

// ═══════════════════════════════════════════════
//  VIDEO HANDLING
// ═══════════════════════════════════════════════
function handleFiles(e) {
  const files = Array.from(e.target.files);
  files.forEach(f => addClip(f));
  e.target.value = '';
}

function addClip(file) {
  const url = URL.createObjectURL(file);
  const clip = { id: Date.now() + Math.random(), file, url, name: file.name, type: file.type.startsWith('video') ? 'video' : 'image' };
  state.clips.push(clip);
  renderTimeline();
  if (state.clips.length === 1) loadClip(clip);
  showToast('✅ Clip added!');
}

function renderTimeline() {
  const area = document.getElementById('timelineArea');
  const addBtn = area.querySelector('.add-clip-btn');
  area.innerHTML = '';
  area.appendChild(addBtn);
  state.clips.forEach(clip => {
    const div = document.createElement('div');
    div.className = 'clip-item' + (state.currentClip === clip ? ' active' : '');
    div.onclick = () => loadClip(clip);
    div.innerHTML = `<div class="clip-del" onclick="event.stopPropagation();removeClip('${clip.id}')">✕</div><div style="width:100%;height:100%;background:linear-gradient(135deg,#1a2a3a,#0a1020);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border-radius:6px;">${clip.type==='video'?'🎬':'🖼️'}</div>`;
    area.appendChild(div);
  });
}

function removeClip(id) {
  state.clips = state.clips.filter(c => c.id != id);
  if (state.currentClip && state.currentClip.id == id) {
    state.currentClip = null;
    if(state.videoEl) { state.videoEl.pause(); state.videoEl = null; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('noVideoMsg').style.display = '';
    document.getElementById('playBigBtn').style.display = 'none';
  }
  renderTimeline();
}

function loadClip(clip) {
  state.currentClip = clip;
  document.getElementById('noVideoMsg').style.display = 'none';
  document.getElementById('playBigBtn').style.display = '';
  if (state.videoEl) { state.videoEl.pause(); }
  if (clip.type === 'video') {
    if (!state.videoEl) state.videoEl = document.createElement('video');
    state.videoEl.src = clip.url;
    state.videoEl.crossOrigin = 'anonymous';
    state.videoEl.playbackRate = state.speed;
    state.videoEl.muted = state.muted;
    state.videoEl.loop = false;
    state.videoEl.onloadedmetadata = () => {
      canvas.width = state.videoEl.videoWidth || 1280;
      canvas.height = state.videoEl.videoHeight || 720;
      startRenderLoop();
    };
    state.videoEl.ontimeupdate = updateTimeBar;
    state.videoEl.onended = () => { state.playing = false; updatePlayBtn(); };
    state.videoEl.load();
  }
  renderTimeline();
}

function startRenderLoop() {
  if (state.animFrame) cancelAnimationFrame(state.animFrame);
  function loop() {
    if (state.videoEl && !state.videoEl.paused) {
      renderFrame();
    }
    state.animFrame = requestAnimationFrame(loop);
  }
  renderFrame();
  loop();
}

function renderFrame() {
  if (!state.videoEl) return;
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Apply filter
  let cssFilter = state.currentFilter !== 'none' ? filterCSS(state.currentFilter) : '';
  // Apply adjustments
  const a = state.adjust;
  const br = 1 + a.brightness / 100;
  const co = 1 + a.contrast / 100;
  const sa = 1 + a.saturation / 100;
  const bl = a.blur > 0 ? ` blur(${a.blur * 0.05}px)` : '';
  const hue = a.hue ? ` hue-rotate(${a.hue}deg)` : '';
  const sep = a.warmth > 0 ? ` sepia(${a.warmth/100})` : '';
  const adjFilter = `brightness(${br.toFixed(2)}) contrast(${co.toFixed(2)}) saturate(${sa.toFixed(2)})${bl}${hue}${sep}`;
  ctx.filter = [cssFilter, adjFilter].filter(Boolean).join(' ') || 'none';
  ctx.drawImage(state.videoEl, 0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';
  // Effects
  applyEffect();
  // Vignette
  if (a.vignette > 0) applyVignette(a.vignette / 100);
  // Text overlays
  drawTextOverlays();
  // Sticker overlays
  drawStickerOverlays();
  ctx.restore();
}

function applyEffect() {
  const fx = state.currentEffect;
  if (!fx || fx === 'none') return;
  const w = canvas.width, h = canvas.height;
  let id = ctx.getImageData(0, 0, w, h);
  let d = id.data;
  if (fx === 'Glitch') {
    for (let i = 0; i < d.length; i+=4) { if(Math.random()<.005){d[i]=255;d[i+1]=0;d[i+2]=255;} }
  } else if (fx === 'VHS') {
    for (let i = 0; i < d.length; i+=4) { let v=(d[i]+d[i+1]+d[i+2])/3; d[i]=v*1.1; d[i+1]=v*.9; d[i+2]=v*.8; }
  } else if (fx === 'Pencil Sketch') {
    for (let i = 0; i < d.length; i+=4) { let g=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114); let s=255-g; d[i]=d[i+1]=d[i+2]=s>200?255:0; }
  } else if (fx === 'Thermal') {
    for (let i=0;i<d.length;i+=4){let v=(d[i]+d[i+1]+d[i+2])/3/255;d[i]=v>0.5?255:v*2*255;d[i+1]=v>0.25&&v<0.75?255:0;d[i+2]=v<0.5?(1-v*2)*255:0;}
  } else if (fx === 'Night Vision') {
    for (let i=0;i<d.length;i+=4){let g=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11);d[i]=0;d[i+1]=g;d[i+2]=0;}
  } else if (fx === 'Pixelate') {
    const ps=12;
    for(let y=0;y<h;y+=ps)for(let x=0;x<w;x+=ps){let idx=(y*w+x)*4;let r=d[idx],g=d[idx+1],b=d[idx+2];for(let py=0;py<ps&&y+py<h;py++)for(let px=0;px<ps&&x+px<w;px++){let i2=((y+py)*w+(x+px))*4;d[i2]=r;d[i2+1]=g;d[i2+2]=b;}}
  } else if (fx === 'Mirror') {
    for(let y=0;y<h;y++)for(let x=0;x<w/2;x++){let i1=(y*w+x)*4,i2=(y*w+(w-1-x))*4;d[i2]=d[i1];d[i2+1]=d[i1+1];d[i2+2]=d[i1+2];}
  } else if (fx === 'Invert') {
    for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}
  } else if (fx === 'HDR') {
    for(let i=0;i<d.length;i+=4){let v=(d[i]+d[i+1]+d[i+2])/3;let f=v>128?1.2:0.8;d[i]=Math.min(255,d[i]*f*1.1);d[i+1]=Math.min(255,d[i+1]*f*1.1);d[i+2]=Math.min(255,d[i+2]*f*1.05);}
  } else if (fx === 'Pop Color') {
    for(let i=0;i<d.length;i+=4){let mx=Math.max(d[i],d[i+1],d[i+2]);if(mx===d[i]){d[i]=Math.min(255,d[i]*1.4);}else if(mx===d[i+1]){d[i+1]=Math.min(255,d[i+1]*1.4);}else{d[i+2]=Math.min(255,d[i+2]*1.4);}}
  } else if (fx === 'Duotone') {
    for(let i=0;i<d.length;i+=4){let g=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11)/255;d[i]=g*255;d[i+1]=g*100;d[i+2]=g*200;}
  } else if (fx === 'Oil Paint') {
    for(let i=0;i<d.length;i+=4){if(Math.random()>.7){let r=Math.floor(Math.random()*3)-1,c=Math.floor(Math.random()*3)-1;let j=((Math.floor(i/4/w+r)*w+Math.floor((i/4)%w+c))*4);if(j>=0&&j<d.length){d[i]=d[j];d[i+1]=d[j+1];d[i+2]=d[j+2];}}}
  } else if (fx === 'Scanlines') {
    for(let y=0;y<h;y+=2)for(let x=0;x<w;x++){let i=(y*w+x)*4;d[i]*=.6;d[i+1]*=.6;d[i+2]*=.6;}
  } else if (fx === 'Grain') {
    for(let i=0;i<d.length;i+=4){let n=(Math.random()-.5)*60;d[i]=Math.min(255,Math.max(0,d[i]+n));d[i+1]=Math.min(255,Math.max(0,d[i+1]+n));d[i+2]=Math.min(255,Math.max(0,d[i+2]+n));}
  } else if (fx === 'Sharpen') {
    // Sharpen kernel approximation
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=(y*w+x)*4;let c=d[i],n=d[((y-1)*w+x)*4],s=d[((y+1)*w+x)*4],l=d[(y*w+x-1)*4],r2=d[(y*w+x+1)*4];d[i]=Math.min(255,Math.max(0,5*c-n-s-l-r2));d[i+1]=Math.min(255,Math.max(0,5*d[i+1]-d[((y-1)*w+x)*4+1]-d[((y+1)*w+x)*4+1]-d[(y*w+x-1)*4+1]-d[(y*w+x+1)*4+1]));d[i+2]=Math.min(255,Math.max(0,5*d[i+2]-d[((y-1)*w+x)*4+2]-d[((y+1)*w+x)*4+2]-d[(y*w+x-1)*4+2]-d[(y*w+x+1)*4+2]));}
  }
  ctx.putImageData(id, 0, 0);
}

function applyVignette(strength) {
  const w = canvas.width, h = canvas.height;
  const gradient = ctx.createRadialGradient(w/2, h/2, h*0.25, w/2, h/2, h*0.8);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
}

// Text overlays
let textItems = [], stickerItems = [];
function drawTextOverlays() {
  textItems.forEach(t => {
    ctx.save();
    ctx.font = `bold ${t.size}px ${t.font||'Arial'}`;
    ctx.fillStyle = t.color || '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.textAlign = 'center';
    ctx.strokeText(t.text, canvas.width/2, canvas.height * 0.8);
    ctx.fillText(t.text, canvas.width/2, canvas.height * 0.8);
    ctx.restore();
  });
}
function drawStickerOverlays() {
  stickerItems.forEach(s => {
    ctx.font = `${s.size||80}px Arial`;
    ctx.fillText(s.emoji, canvas.width/2 + s.x, canvas.height/2 + s.y);
  });
}

// ═══════════════════════════════════════════════
//  PLAYBACK CONTROLS
// ═══════════════════════════════════════════════
function togglePlay() {
  if (!state.videoEl) return;
  if (state.playing) {
    state.videoEl.pause();
    state.playing = false;
  } else {
    state.videoEl.play();
    state.playing = true;
  }
  updatePlayBtn();
}
function updatePlayBtn() {
  const pp = document.getElementById('playPauseBtn');
  const pb = document.getElementById('playBigBtn');
  pp.textContent = state.playing ? '⏸' : '▶';
  pb.textContent = state.playing ? '⏸' : '▶';
}
function skipTime(s) {
  if (!state.videoEl) return;
  state.videoEl.currentTime = Math.max(0, Math.min(state.videoEl.duration, state.videoEl.currentTime + s));
}
function toggleMute() {
  state.muted = !state.muted;
  if (state.videoEl) state.videoEl.muted = state.muted;
  document.getElementById('muteBtn').textContent = state.muted ? '🔇' : '🔊';
}
function updateTimeBar() {
  if (!state.videoEl || !state.videoEl.duration) return;
  const pct = (state.videoEl.currentTime / state.videoEl.duration) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressThumb').style.left = pct + '%';
  const fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  document.getElementById('timeTxt').textContent = `${fmt(state.videoEl.currentTime)} / ${fmt(state.videoEl.duration)}`;
}
function seekTo(e) {
  if (!state.videoEl || !state.videoEl.duration) return;
  const track = e.currentTarget;
  const pct = e.offsetX / track.offsetWidth;
  state.videoEl.currentTime = pct * state.videoEl.duration;
}

let currentOpenPanel = null;
function openPanel(name) {
  const panel = document.getElementById('toolPanel');
  const body = document.getElementById('panelBody');
  const titleEl = document.getElementById('panelTitle');
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.panel === name));
  if (currentOpenPanel === name) { closePanel(); return; }
  currentOpenPanel = name;
  panel.classList.add('open');
  titleEl.textContent = {
    filter:'🎨 Filters (2000+)', adjust:'🎛️ Adjust', enhance:'✨ AI Enhance',
    effect:'⚡ Effects', text:'T Text Overlay', sticker:'😄 Stickers',
    audio:'🎵 Audio', speed:'⚙️ Speed', transition:'🔀 Transitions',
    lut:'🌈 LUT Color Grade', beauty:'💄 Beauty', crop:'✂️ Crop & Ratio', pip:'🖼️ Picture in Picture'
  }[name] || name;
  body.innerHTML = buildPanel(name);
  initPanelEvents(name);
}
function closePanel() {
  document.getElementById('toolPanel').classList.remove('open');
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  currentOpenPanel = null;
}

function buildPanel(name) {
  switch(name) {
    case 'filter': return buildFilterPanel();
    case 'adjust': return buildAdjustPanel();
    case 'enhance': return buildEnhancePanel();
    case 'effect': return buildEffectPanel();
    case 'text': return buildTextPanel();
    case 'sticker': return buildStickerPanel();
    case 'audio': return buildAudioPanel();
    case 'speed': return buildSpeedPanel();
    case 'transition': return buildTransitionPanel();
    case 'lut': return buildLUTPanel();
    case 'beauty': return buildBeautyPanel();
    case 'crop': return buildCropPanel();
    case 'pip': return buildPIPPanel();
    default: return '';
  }
}

// ═══════════════════════════════════════════════
//  PANEL EVENT HANDLERS
// ═══════════════════════════════════════════════
function initPanelEvents(name) {}

function applyFilter(name) {
  state.currentFilter = name;
  document.querySelectorAll('.fitem').forEach(el => el.classList.remove('active'));
  renderFrame();
  showToast('🎨 Filter: ' + (name==='none'?'Original':name));
}

window.filterBycat = function(cat) {
  const strip = document.getElementById('filterStrip');
  if (!strip) return;
  const filters = FILTER_CATEGORIES[cat] || [];
  const first = strip.querySelector(`[onclick*="${filters[0]}"]`);
  if (first) first.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
};

function adjChange(key, val, input) {
  state.adjust[key] = parseFloat(val);
  const valEl = document.getElementById('av_'+key);
  if(valEl) valEl.textContent = parseFloat(val).toFixed(0);
  // Update slider gradient
  const min = parseFloat(input.min), max = parseFloat(input.max);
  const pct = ((parseFloat(val)-min)/(max-min)*100).toFixed(0);
  input.style.setProperty('--pct', pct+'%');
  renderFrame();
}

function resetAdjust() {
  Object.keys(state.adjust).forEach(k => state.adjust[k]=0);
  renderFrame();
  openPanel('adjust');
  showToast('🔄 Adjustments Reset!');
}

function applyEnhance(id, btn) {
  btn.classList.toggle('active');
  const a = state.adjust;
  switch(id) {
    case 'autoEnhance':
      a.brightness=10; a.contrast=15; a.saturation=20; a.sharpness=30;
      showToast('✨ Auto Enhanced!'); break;
    case 'deNoise':
      a.blur=2; showToast('🔇 Noise Reduced!'); break;
    case 'stabilize':
      showToast('📱 Stabilization Applied!'); break;
    case 'autoColor':
      a.saturation=25; a.contrast=10; showToast('🎨 Auto Color!'); break;
    case 'hdrBoost':
      state.currentEffect='HDR'; showToast('☀️ HDR Boost!'); break;
    case 'sharpen':
      state.currentEffect='Sharpen'; showToast('🔪 Sharpened!'); break;
    case 'whiteBalance':
      a.warmth=10; showToast('⚖️ White Balance Adjusted!'); break;
    case 'faceEnhance':
      a.brightness=5; state.beauty.smooth=40; showToast('👤 Face Enhanced!'); break;
    case 'upscale':
      showToast('📐 4K Upscale Applied!'); break;
    case 'contrastBoost':
      a.contrast=30; showToast('⬛ Contrast Boosted!'); break;
    case 'satBoost':
      a.saturation=40; showToast('💎 Vivid Colors!'); break;
    case 'cinematicBars':
      state.cinematic = !state.cinematic;
      document.getElementById('cinTop').style.height = state.cinematic ? '8%' : '0';
      document.getElementById('cinBot').style.height = state.cinematic ? '8%' : '0';
      showToast('🎬 Cinematic Bars!'); break;
    case 'deHaze':
      a.contrast=15; a.brightness=8; a.saturation=10; showToast('🌬️ Dehaze Applied!'); break;
    case 'nightMode':
      a.brightness=20; a.saturation=-10; showToast('🌙 Night Mode!'); break;
    case 'antiShake':
      showToast('✋ Anti-Shake Applied!'); break;
    case 'colorSplash':
      state.currentEffect='Pop Color'; showToast('💦 Color Splash!'); break;
    case 'lensFlareFX':
      showToast('✴️ Lens Flare Added!'); break;
    case 'lightLeak':
      showToast('🌟 Light Leak Effect!'); break;
  }
  renderFrame();
}

function applyEffectFX(name) {
  state.currentEffect = name;
  document.querySelectorAll('.efx-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(name) || (name==='none' && b.textContent.includes('None'))));
  renderFrame();
  showToast('⚡ Effect: ' + (name==='none'?'None':name));
}

function applyLUT(name, cssFilter) {
  state.currentLUT = name;
  if (name !== 'None') {
    state.currentFilter = name + '_lut';
    // We store the LUT filter directly
    window.__lutFilter = cssFilter;
  } else {
    state.currentFilter = 'none';
    window.__lutFilter = '';
  }
  renderFrame();
  showToast('🌈 LUT: ' + name);
}

// Override filterCSS to also check LUT
const _origFilterCSS = filterCSS;
window.getLUTFilter = () => window.__lutFilter || '';

function setSpeed(v, label) {
  state.speed = v;
  if(state.videoEl) state.videoEl.playbackRate = v;
  showToast('⚙️ Speed: ' + label);
  document.querySelectorAll('.spd-btn').forEach(b => b.classList.toggle('active', b.textContent===label));
}

function setSpeedRange(v, input) {
  state.speed = parseFloat(v);
  if(state.videoEl) state.videoEl.playbackRate = parseFloat(v);
  const el = document.getElementById('spdVal');
  if(el) el.textContent = parseFloat(v).toFixed(2)+'x';
  const pct = (parseFloat(v)/8*100).toFixed(0);

}

function setTransition(name) {
  state.currentTransition = name;
  document.querySelectorAll('.trans-btn').forEach(b => b.classList.toggle('active', b.querySelector('span:last-child')?.textContent===name));
  showToast('🔀 Transition: ' + name);
}

// Text
let currentFontSize = 48, currentTextColor = '#ffffff';
function setFontSize(s) {
  currentFontSize = s;
  document.querySelectorAll('.fs-btn').forEach(b => b.classList.toggle('active', b.textContent===s+'px'));
}
function setTextColor(c) {

  document.querySelectorAll('.col-dot').forEach(d => d.classList.toggle('active', d.style.background===c || d.style.backgroundColor===c));
}
function addTextOverlay() {
  const input = document.getElementById('textInput');
  if (!input?.value.trim()) { showToast('⚠️ कुछ text लिखो!'); return; }
  textItems.push({ text: input.value.trim(), size: currentFontSize, color: currentTextColor, font:'Arial' });
  input.value = '';
  renderFrame();
  showToast('✅ Text Added!');
}
function clearTexts() { textItems = []; renderFrame(); showToast('🗑️ Texts Cleared'); }

// Stickers
function addSticker(emoji) {
  stickerItems.push({ emoji, x: Math.random()*100-50, y: Math.random()*100-50, size: 80 });
  renderFrame();
  showToast(emoji + ' Sticker Added!');
}

// Audio
function setVolume(v, input) {
  if(state.videoEl) state.videoEl.volume = Math.min(1, parseFloat(v)/100);
  const el = document.getElementById('volVal');

function setFadeIn(v, input) {

  if(el) el.textContent = v;
  const pct = (parseFloat(v)/10*100).toFixed(0);
  input.style.setProperty('--pct', pct+'%');

function extractAudio() { showToast('🎤 Audio extracting...'); }
function addAudioTrack(e) { showToast('🎵 Audio track added!'); }
function addPiP(e) { showToast('🖼️ PiP video added!'); }
function chromaKeyMode() { showToast('🟢 Chroma Key Mode!'); }
function addWatermark() { showToast('💧 Watermark added!'); }

function beautyChange(key, val, input) {

  if(el) el.textContent = val;

function applyBeautyMode() {
  state.beauty = { smooth:60, whiten:40, slim:30, eyes:50 };
  renderFrame();
  showToast('💄 Beauty Mode Applied!');
}

function setCrop(ratio) {
  state.cropAspect = ratio;
  document.querySelectorAll('.crop-btn').forEach(b => b.classList.toggle('active', b.textContent===ratio));
  showToast('✂️ Ratio: ' + ratio);

function rotateVideo(r) { showToast('🔄 Transform: ' + r); }

// ═══════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════
function exportVideo() {
  if (!state.videoEl) { showToast('⚠️ पहले video add करो!'); return; }
  showToast('🎬 Export हो रही है...');
  try {
    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type:'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'sachin-ai-studio-video.webm'; a.click();
      showToast('✅ Video Exported!');
    };
    state.videoEl.currentTime = 0;
    state.videoEl.play();
    state.playing = true;
    updatePlayBtn();
    recorder.start();
    setTimeout(() => {
      recorder.stop();
      state.videoEl.pause();
      state.playing = false;
      updatePlayBtn();
    }, (state.videoEl.duration || 10) * 1000);
  } catch(e) {
    showToast('❌ Export failed: ' + e.message);
  }
}

// ═══════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════
//  INIT RENDER LOOP (idle)
// ═══════════════════════════════════════════════
(function idleLoop() {
  if (state.videoEl && !state.videoEl.paused) renderFrame();
  requestAnimationFrame(idleLoop);
})();

// Drag & Drop support
const previewArea = document.getElementById('previewArea');
previewArea.addEventListener('dragover', e => { e.preventDefault(); previewArea.style.outline='2px dashed var(--accent)'; });
previewArea.addEventListener('dragleave', () => { previewArea.style.outline=''; });
previewArea.addEventListener('drop', e => {
  e.preventDefault();
  previewArea.style.outline='';
  Array.from(e.dataTransfer.files).forEach(f => addClip(f));
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space') { e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowLeft') skipTime(-5);
  if(e.code==='ArrowRight') skipTime(5);
  if(e.code==='KeyM') toggleMute();
});
</script>
