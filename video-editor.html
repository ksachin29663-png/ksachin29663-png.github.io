<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pro Video Editor — CapCut Level — Sachin AI Studio</title>
<link rel="icon" href="/favicon.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3019468976412219" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0c0c0c;--panel:#181818;--panel2:#222;--border:#2e2e2e;
  --accent:#ff4d6d;--blue:#4cc9f0;--green:#06d6a0;--yellow:#ffd60a;--purple:#b5179e;
  --text:#f0f0f0;--muted:#888;--white:#fff;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}

/* ── TOPBAR ── */
.topbar{height:48px;background:#000;display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;border-bottom:1px solid #1a1a1a;z-index:300;}
.btn-back{color:var(--text);background:none;border:none;font-size:1.2rem;cursor:pointer;padding:6px 8px;}
.topbar-center{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;}
.top-project{font-size:.8rem;font-weight:700;color:var(--white);}
.topbar-right{display:flex;align-items:center;gap:6px;}
.btn-icon{background:none;border:1px solid #333;color:var(--muted);border-radius:6px;padding:5px 10px;font-size:.72rem;cursor:pointer;transition:.2s;white-space:nowrap;}
.btn-icon:hover{border-color:var(--accent);color:var(--accent);}
.btn-export{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:.78rem;font-weight:700;cursor:pointer;}
.btn-export:hover{background:#ff2d55;}
.ratio-badge{background:#1a1a1a;border:1px solid #333;color:var(--muted);padding:5px 10px;font-size:.7rem;border-radius:6px;cursor:pointer;}

/* ── MAIN AREA ── */
.editor-wrap{display:flex;flex-direction:column;height:calc(100vh - 48px);}

/* ── PREVIEW ── */
.preview-section{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
.canvas-container{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
#mainCanvas{max-width:100%;max-height:100%;border-radius:3px;display:block;}
.preview-ui{position:absolute;inset:0;pointer-events:none;}
.safe-area-indicator{position:absolute;inset:8%;border:1px dashed rgba(255,255,255,.1);border-radius:4px;}
.time-code{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:4px;font-size:.68rem;font-family:monospace;color:#ddd;}
.play-center-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:all;}
.play-big{width:56px;height:56px;background:rgba(0,0,0,.55);border-radius:50%;border:2px solid rgba(255,255,255,.5);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:.2s;}
.play-big:hover{background:rgba(255,77,109,.7);border-color:var(--accent);}
.no-vid{text-align:center;color:var(--muted);}
.no-vid .nv-icon{font-size:3.5rem;margin-bottom:10px;}
.no-vid p{font-size:.82rem;line-height:1.6;}

/* Cinematic bars */
.cin-top,.cin-bot{position:absolute;left:0;right:0;background:#000;transition:.4s;pointer-events:none;}
.cin-top{top:0;height:0;}
.cin-bot{bottom:0;height:0;}

/* ── TIMELINE SECTION ── */
.timeline-section{background:#111;border-top:1px solid #222;flex-shrink:0;}

/* Progress */
.prog-bar-wrap{height:24px;display:flex;align-items:center;padding:0 10px;gap:8px;background:#0a0a0a;}
.time-display{font-size:.68rem;font-family:monospace;color:var(--muted);min-width:88px;}
.prog-track{flex:1;height:3px;background:#2a2a2a;border-radius:3px;cursor:pointer;position:relative;}
.prog-fill{height:100%;background:var(--accent);border-radius:3px;}
.prog-thumb{position:absolute;top:50%;width:11px;height:11px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(255,77,109,.7);}

/* Timeline tracks */
.tracks-area{height:110px;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.track-row{height:34px;display:flex;align-items:center;border-bottom:1px solid #1a1a1a;position:relative;}
.track-label{width:52px;flex-shrink:0;font-size:.58rem;color:var(--muted);text-align:center;border-right:1px solid #222;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;background:#0e0e0e;}
.track-content{flex:1;height:100%;overflow-x:auto;display:flex;align-items:center;gap:3px;padding:4px 6px;scrollbar-width:none;position:relative;}
.track-content::-webkit-scrollbar{display:none;}
.clip-block{height:26px;min-width:70px;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:.6rem;cursor:pointer;position:relative;flex-shrink:0;transition:.15s;user-select:none;}
.clip-block.video-clip{background:linear-gradient(135deg,#1a3a5c,#0d2240);border:1.5px solid #2a5a8c;color:#7bc8ff;}
.clip-block.audio-clip{background:linear-gradient(135deg,#1a3a1a,#0d2a0d);border:1.5px solid #2a8c2a;color:#7bff7b;}
.clip-block.text-clip{background:linear-gradient(135deg,#3a1a3a,#2a0d2a);border:1.5px solid #8c2a8c;color:#ff7bff;}
.clip-block.effect-clip{background:linear-gradient(135deg,#3a3a1a,#2a2a0d);border:1.5px solid #8c8c2a;color:#ffff7b;}
.clip-block.active-clip{border-color:var(--accent) !important;box-shadow:0 0 8px rgba(255,77,109,.4);}
.clip-trim-left,.clip-trim-right{position:absolute;top:0;bottom:0;width:6px;background:rgba(255,255,255,.3);cursor:ew-resize;border-radius:3px 0 0 3px;}
.clip-trim-left{left:0;}
.clip-trim-right{right:0;border-radius:0 3px 3px 0;}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;z-index:10;}
.playhead::before{content:'▼';position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:.55rem;color:var(--accent);}
.add-track-btn{width:44px;height:22px;background:none;border:1px dashed #333;border-radius:4px;color:#555;font-size:.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px;flex-shrink:0;white-space:nowrap;transition:.2s;}
.add-track-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Quick controls */
.quick-controls{height:38px;display:flex;align-items:center;gap:4px;padding:0 8px;background:#0e0e0e;border-top:1px solid #1a1a1a;}
.qc-btn{background:none;border:1px solid #2a2a2a;color:var(--muted);border-radius:6px;padding:4px 10px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;gap:4px;transition:.2s;white-space:nowrap;}
.qc-btn:hover{border-color:var(--blue);color:var(--blue);}
.qc-sep{width:1px;height:20px;background:#2a2a2a;margin:0 2px;}
.play-row{display:flex;align-items:center;justify-content:center;flex:1;gap:10px;}
.pb-btn{background:none;border:none;color:var(--text);font-size:1.1rem;cursor:pointer;padding:4px;transition:.2s;}
.pb-btn:hover{color:var(--accent);}
.pb-play{width:34px;height:34px;background:var(--accent);border-radius:50%;font-size:.9rem;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:.2s;}
.pb-play:hover{background:#ff2d55;transform:scale(1.07);}

/* ── TOOL PANEL ── */
.tool-panel{background:var(--panel);border-top:1px solid #2a2a2a;flex-shrink:0;max-height:0;overflow:hidden;transition:max-height .3s;}
.tool-panel.open{max-height:240px;}
.tp-tabs{display:flex;border-bottom:1px solid #222;overflow-x:auto;scrollbar-width:none;background:#111;}
.tp-tabs::-webkit-scrollbar{display:none;}
.tp-tab{padding:7px 14px;font-size:.65rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;transition:.15s;}
.tp-tab:hover{color:var(--white);}
.tp-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tp-close{margin-left:auto;padding:7px 12px;background:none;border:none;color:#555;cursor:pointer;font-size:.9rem;flex-shrink:0;}
.tp-body{overflow-y:auto;height:calc(100% - 32px);padding:10px 12px;max-height:208px;}
.tp-body::-webkit-scrollbar{width:2px;}
.tp-body::-webkit-scrollbar-thumb{background:#333;}

/* ── BOTTOM TOOLBAR ── */
.bottom-toolbar{background:#000;border-top:1px solid #1a1a1a;padding:5px 0 6px;flex-shrink:0;}
.toolbar-scroll{display:flex;overflow-x:auto;gap:0;padding:0 6px;scrollbar-width:none;}
.toolbar-scroll::-webkit-scrollbar{display:none;}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 12px;cursor:pointer;border:none;background:none;flex-shrink:0;border-radius:8px;transition:.15s;min-width:60px;}
.tool-btn:hover{background:rgba(255,255,255,.05);}
.tool-btn.active{background:rgba(255,77,109,.1);}
.t-icon{font-size:1.2rem;line-height:1;}
.t-label{font-size:.58rem;color:var(--muted);white-space:nowrap;}
.tool-btn.active .t-label{color:var(--accent);}
.tool-btn.active .t-icon{filter:drop-shadow(0 0 3px var(--accent));}
.toolbar-sep{width:1px;background:#1a1a1a;margin:4px 2px;flex-shrink:0;}

/* ── PANEL CONTENT COMPONENTS ── */
/* Horizontal scroll strip */
.h-strip{display:flex;gap:7px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;}
.h-strip::-webkit-scrollbar{display:none;}

/* Filter/Effect item */
.fi-item{flex-shrink:0;text-align:center;cursor:pointer;width:68px;}
.fi-thumb{width:68px;height:52px;border-radius:9px;border:2px solid transparent;overflow:hidden;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:1.6rem;transition:.2s;}
.fi-item.active .fi-thumb{border-color:var(--accent);box-shadow:0 0 8px rgba(255,77,109,.4);}
.fi-name{font-size:.58rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:68px;}
.fi-item.active .fi-name{color:var(--accent);}

/* Category tabs */
.cat-tabs{display:flex;gap:5px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none;flex-shrink:0;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-btn{padding:4px 11px;border-radius:14px;border:1px solid #333;background:none;color:var(--muted);font-size:.62rem;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.2s;}
.cat-btn:hover,.cat-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(255,77,109,.08);}

/* Slider row */
.sl-row{margin-bottom:10px;}
.sl-row label{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-bottom:4px;}
.sl-val{color:var(--accent);font-weight:700;}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;background:linear-gradient(to right,var(--accent) var(--pct,50%),#2a2a2a var(--pct,50%));border-radius:3px;cursor:pointer;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 5px rgba(255,77,109,.6);cursor:pointer;}

/* Grid */
.feat-grid{display:grid;gap:7px;}
.feat-grid.col2{grid-template-columns:1fr 1fr;}
.feat-grid.col3{grid-template-columns:1fr 1fr 1fr;}
.feat-grid.col4{grid-template-columns:repeat(4,1fr);}
.feat-btn{padding:8px 5px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;font-size:.62rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;}
.feat-btn .fi2{font-size:1.2rem;}
.feat-btn:hover,.feat-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(255,77,109,.07);}
.feat-btn.green:hover,.feat-btn.green.active{border-color:var(--green);color:var(--green);background:rgba(6,214,160,.07);}
.feat-btn.blue:hover,.feat-btn.blue.active{border-color:var(--blue);color:var(--blue);background:rgba(76,201,240,.07);}
.feat-btn.yellow:hover,.feat-btn.yellow.active{border-color:var(--yellow);color:var(--yellow);background:rgba(255,214,10,.07);}
.feat-btn.purple:hover,.feat-btn.purple.active{border-color:var(--purple);color:var(--purple);background:rgba(181,23,158,.07);}

/* Pill buttons */
.pill-row{display:flex;flex-wrap:wrap;gap:5px;}
.pill{padding:5px 12px;border-radius:16px;border:1px solid #333;background:none;color:var(--muted);font-size:.65rem;cursor:pointer;transition:.2s;white-space:nowrap;}
.pill:hover,.pill.active{border-color:var(--accent);color:var(--accent);background:rgba(255,77,109,.08);}
.pill.green-pill:hover,.pill.green-pill.active{border-color:var(--green);color:var(--green);background:rgba(6,214,160,.08);}
.pill.blue-pill:hover,.pill.blue-pill.active{border-color:var(--blue);color:var(--blue);}
.pill.yellow-pill:hover,.pill.yellow-pill.active{border-color:var(--yellow);color:var(--yellow);}

/* Text input */
.t-input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:.8rem;outline:none;margin-bottom:8px;}
.t-input:focus{border-color:var(--accent);}

/* Sticker grid */
.sticker-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
.stk{font-size:1.5rem;text-align:center;cursor:pointer;padding:3px;border-radius:6px;transition:.15s;}
.stk:hover{background:rgba(255,255,255,.1);transform:scale(1.2);}

/* Speed curve visual */
.speed-visual{height:48px;background:#1a1a1a;border-radius:8px;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted);margin-bottom:8px;}

/* Toast */
.toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%) scale(.8);background:rgba(20,20,20,.95);color:#fff;padding:8px 18px;border-radius:20px;font-size:.75rem;border:1px solid #333;opacity:0;transition:.25s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) scale(1);}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--panel);border:1px solid #333;border-radius:14px;padding:20px;max-width:320px;width:90%;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:.9rem;font-weight:700;margin-bottom:14px;color:var(--white);}
.modal-close{float:right;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;}

#fileInput,#audioInput,#pipInput,#bgInput{display:none;}

/* Keyframe indicator */
.kf-dot{width:8px;height:8px;background:var(--yellow);border-radius:50%;border:1px solid #000;cursor:pointer;}

/* Sub-panel section title */
.sp-title{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:8px 0 5px;font-weight:700;}

/* Color dots */
.color-row{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
.c-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s;flex-shrink:0;}
.c-dot:hover,.c-dot.active{border-color:#fff;transform:scale(1.15);}

@media(max-width:430px){
  .tool-btn{min-width:52px;padding:5px 8px;}
  .feat-grid.col4{grid-template-columns:repeat(3,1fr);}
  .sticker-grid{grid-template-columns:repeat(6,1fr);}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button class="btn-back" onclick="history.back()">←</button>
  <div class="topbar-center">
    <span class="top-project" id="projectName">New Project</span>
  </div>
  <div class="topbar-right">
    <div class="ratio-badge" onclick="openPanel('canvas')" id="ratioBadge">9:16</div>
    <button class="btn-icon" onclick="openPanel('ai')">✨ AI</button>
    <button class="btn-icon" id="btnUndo" onclick="doUndo()">↩</button>
    <button class="btn-icon" id="btnRedo" onclick="doRedo()">↪</button>
    <button class="btn-export" onclick="startExport()">Export ↗</button>
  </div>
</div>

<div class="editor-wrap">
  <!-- PREVIEW -->
  <div class="preview-section" id="previewSection">
    <div class="canvas-container">
      <canvas id="mainCanvas" width="1080" height="1920"></canvas>
      <div class="cin-top" id="cinTop"></div>
      <div class="cin-bot" id="cinBot"></div>
    </div>
    <div class="preview-ui">
      <div class="time-code" id="timeCode">00:00.00</div>
      <div class="safe-area-indicator"></div>
      <div class="play-center-btn" id="playCenterBtn">
        <div class="no-vid" id="noVidMsg">
          <div class="nv-icon">🎬</div>
          <p><strong>+ Add</strong> दबाएं और Video चुनें<br><span style="font-size:.72rem">Drag & Drop भी काम करता है</span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- PROGRESS BAR -->
  <div class="prog-bar-wrap">
    <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
    <div class="prog-track" id="progTrack" onclick="seekClick(event)">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
      <div class="prog-thumb" id="progThumb" style="left:0%"></div>
    </div>
  </div>

  <!-- TIMELINE -->
  <div class="timeline-section">
    <div class="tracks-area" id="tracksArea">
      <!-- Track: Video -->
      <div class="track-row">
        <div class="track-label">🎬<br><span style="font-size:.5rem">Video</span></div>
        <div class="track-content" id="videoTrack">
          <button class="add-track-btn" onclick="document.getElementById('fileInput').click()">➕ Video</button>
        </div>
      </div>
      <!-- Track: Audio -->
      <div class="track-row">
        <div class="track-label">🎵<br><span style="font-size:.5rem">Audio</span></div>
        <div class="track-content" id="audioTrack">
          <button class="add-track-btn" onclick="document.getElementById('audioInput').click()">➕ Music</button>
        </div>
      </div>
      <!-- Track: Text -->
      <div class="track-row">
        <div class="track-label">T<br><span style="font-size:.5rem">Text</span></div>
        <div class="track-content" id="textTrack">
          <button class="add-track-btn" onclick="openPanel('text')">➕ Text</button>
        </div>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="quick-controls">
      <button class="qc-btn" onclick="splitClip()">✂️ Split</button>
      <button class="qc-btn" onclick="deleteActive()">🗑️ Del</button>
      <button class="qc-btn" onclick="duplicateActive()">⧉ Dup</button>
      <div class="qc-sep"></div>
      <div class="play-row">
        <button class="pb-btn" onclick="skipTime(-10)">⏮</button>
        <button class="pb-btn" onclick="skipTime(-1)">⏪</button>
        <button class="pb-play" id="playPauseBtn" onclick="togglePlay()">▶</button>
        <button class="pb-btn" onclick="skipTime(1)">⏩</button>
        <button class="pb-btn" onclick="skipTime(10)">⏭</button>
      </div>
      <div class="qc-sep"></div>
      <button class="qc-btn" onclick="toggleMute()" id="muteBtn">🔊</button>
      <button class="qc-btn" onclick="openPanel('speed')">⚙️ Speed</button>
    </div>
  </div>

  <!-- TOOL PANEL -->
  <div class="tool-panel" id="toolPanel">
    <div class="tp-tabs" id="tpTabs">
      <!-- tabs injected per panel -->
      <button class="tp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="tp-body" id="tpBody"></div>
  </div>

  <!-- BOTTOM TOOLBAR -->
  <div class="bottom-toolbar">
    <div class="toolbar-scroll">
      <button class="tool-btn" data-p="filter" onclick="openPanel('filter')"><span class="t-icon">🎨</span><span class="t-label">Filter</span></button>
      <button class="tool-btn" data-p="adjust" onclick="openPanel('adjust')"><span class="t-icon">🎛️</span><span class="t-label">Adjust</span></button>
      <button class="tool-btn" data-p="enhance" onclick="openPanel('enhance')"><span class="t-icon">✨</span><span class="t-label">Enhance</span></button>
      <button class="tool-btn" data-p="effect" onclick="openPanel('effect')"><span class="t-icon">⚡</span><span class="t-label">Effect</span></button>
      <button class="tool-btn" data-p="transition" onclick="openPanel('transition')"><span class="t-icon">🔀</span><span class="t-label">Transition</span></button>
      <div class="toolbar-sep"></div>
      <button class="tool-btn" data-p="text" onclick="openPanel('text')"><span class="t-icon">T</span><span class="t-label">Text</span></button>
      <button class="tool-btn" data-p="sticker" onclick="openPanel('sticker')"><span class="t-icon">😄</span><span class="t-label">Sticker</span></button>
      <button class="tool-btn" data-p="audio" onclick="openPanel('audio')"><span class="t-icon">🎵</span><span class="t-label">Audio</span></button>
      <div class="toolbar-sep"></div>

// Filter CSS generator
function filterCSS(name) {
  const n = name.toLowerCase();
  if(n.includes('clarendon')) return 'contrast(1.2) saturate(1.35)';
  if(n.includes('gingham')) return 'brightness(1.05) hue-rotate(-10deg)';
  if(n.includes('moon')) return 'grayscale(.6) contrast(1.1) brightness(1.1)';
  if(n.includes('lark')) return 'brightness(1.08) contrast(.9) saturate(1.4)';
  if(n.includes('reyes')) return 'brightness(1.1) contrast(.85) saturate(.75) sepia(.22)';
  if(n.includes('juno')) return 'saturate(1.4) contrast(1.15)';
  if(n.includes('slumber')) return 'brightness(1.05) saturate(.66) sepia(.35)';
  if(n.includes('crema')) return 'saturate(.5) contrast(1.2) sepia(.3) hue-rotate(10deg)';
  if(n.includes('ludwig')) return 'brightness(1.05) saturate(1.25)';
  if(n.includes('aden')) return 'brightness(1.2) saturate(.85) hue-rotate(-20deg)';
  if(n.includes('perpetua')) return 'contrast(1.05) saturate(1.1)';
  if(n.includes('amaro')) return 'brightness(1.1) saturate(1.5) hue-rotate(-10deg)';
  if(n.includes('mayfair')) return 'contrast(1.1) saturate(1.1) sepia(.1)';
  if(n.includes('rise')) return 'brightness(1.09) sepia(.3) contrast(.9)';
  if(n.includes('hudson')) return 'brightness(1.2) contrast(.9) saturate(1.1)';
  if(n.includes('valencia')) return 'brightness(1.08) contrast(1.08) sepia(.08)';
  if(n.includes('x pro')) return 'sepia(.45) contrast(1.25) saturate(1.75)';
  if(n.includes('sierra')) return 'sepia(.25) contrast(1.25) brightness(1.1)';
  if(n.includes('willow')) return 'grayscale(.5) contrast(1.2)';
  if(n.includes('lo-fi')) return 'saturate(1.8) contrast(1.15)';
  if(n.includes('earlybird')) return 'sepia(.4) contrast(.9)';
  if(n.includes('brannan')) return 'sepia(.5) contrast(1.4)';
  if(n.includes('inkwell')) return 'grayscale(1) contrast(1.1)';
  if(n.includes('walden')) return 'brightness(1.1) saturate(1.6) sepia(.2)';
  if(n.includes('hefe')) return 'saturate(1.5) contrast(1.4)';
  if(n.includes('nashville')) return 'sepia(.25) contrast(1.5) brightness(.9)';
  if(n.includes('1977')) return 'contrast(1.1) brightness(1.1) sepia(.3)';
  if(n.includes('kelvin')) return 'brightness(1.1) saturate(1.5) sepia(.4)';
  if(n.includes('toaster')) return 'sepia(.5) contrast(1.5) brightness(.9)';
  if(n.includes('film noir')) return 'grayscale(.8) contrast(1.5) brightness(.8)';
  if(n.includes('cyberpunk')) return 'hue-rotate(200deg) saturate(2) contrast(1.3)';
  if(n.includes('synthwave')) return 'hue-rotate(240deg) saturate(1.8)';
  if(n.includes('vaporwave')) return 'hue-rotate(280deg) saturate(1.6) brightness(1.1)';
  if(n.includes('matrix')) return 'sepia(1) hue-rotate(100deg) saturate(3) brightness(.8)';
  if(n.includes('golden hour')) return 'sepia(.4) saturate(1.5) brightness(1.15)';
  if(n.includes('aurora')) return 'hue-rotate(120deg) saturate(1.5) brightness(1.1)';
  if(n.includes('kodak')) return 'sepia(.2) contrast(1.1) saturate(1.15) brightness(1.05)';
  if(n.includes('fuji')) return 'hue-rotate(5deg) saturate(1.2) brightness(1.1)';
  if(n.includes('ilford') || n.includes('b&w') || n.includes('bw') || n.includes('black')) return 'grayscale(1) contrast(1.15)';
  if(n.includes('sepia')) return 'sepia(1) contrast(1.1)';
  if(n.includes('retro') || n.includes('vintage')) return 'sepia(.5) contrast(1.1) saturate(.85)';
  if(n.includes('vhs')) return 'contrast(1.2) saturate(1.5) brightness(.9)';
  if(n.includes('hollywood')) return 'contrast(1.3) saturate(.8) brightness(1.05)';
  if(n.includes('neon pink')) return 'saturate(2) hue-rotate(-30deg) brightness(1.1)';
  if(n.includes('neon blue')) return 'saturate(2) hue-rotate(190deg) brightness(1.1)';
  if(n.includes('neon green')) return 'saturate(2) hue-rotate(130deg) brightness(1.1)';
  if(n.includes('neon purple')) return 'saturate(2) hue-rotate(250deg) brightness(1.1)';
  if(n.includes('dark moody') || n.includes('moody')) return 'brightness(.85) contrast(1.25) saturate(.75)';
  if(n.includes('bollywood') || n.includes('masala') || n.includes('desi')) return 'saturate(1.8) contrast(1.15) brightness(1.05)';
  if(n.includes('k-pop') || n.includes('korean')) return 'brightness(1.15) saturate(.8) contrast(1.05)';
  if(n.includes('warm')) return 'sepia(.25) saturate(1.3) brightness(1.05)';
  if(n.includes('cool') || n.includes('blue')) return 'hue-rotate(195deg) saturate(1.1) brightness(1.05)';
  // Hash-based unique filter
  let h=0; for(let c of name) h=(h*31+c.charCodeAt(0))&0xffffffff;
  const br=0.88+((h&0x1f)/100), co=0.88+(((h>>5)&0x3f)/100), sa=0.65+(((h>>11)&0x7f)/100);
  const hu=(h>>18)&0x1ff, se=((h>>27)&0x0f)/40;
  return `brightness(${br.toFixed(2)}) contrast(${co.toFixed(2)}) saturate(${sa.toFixed(2)}) hue-rotate(${hu}deg) sepia(${se.toFixed(2)})`;
}

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
const S = {
  clips:[], activeClip:null, videoEl:null,
  playing:false, muted:false, speed:1,
  filter:'none', effect:'none', lut:'none', transition:'none',
  adj:{brightness:0,contrast:0,saturation:0,warmth:0,hue:0,vignette:0,blur:0,sharpness:0,fade:0,grain:0,highlights:0,shadows:0,whites:0,blacks:0,clarity:0,texture:0,dehaze:0,exposure:0},
  beauty:{smooth:0,whiten:0,reshape:0,eyes:0,lipstick:0,blush:0,contouring:0},
  textItems:[], stickerItems:[],
  keyframes:[], masks:[], overlays:[],
  cinematic:false, cropRatio:'9:16',
  canvasW:1080, canvasH:1920,
  animFrame:null,
  history:[], histIdx:-1,
  voiceEffect:'none',
  speedCurve:'normal',
};
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

// ══════════════════════════════════════
//  FILE HANDLING
// ══════════════════════════════════════
function handleFileAdd(e) {
  Array.from(e.target.files).forEach(addClip);
  e.target.value='';
}
function addClip(file) {
  const url = URL.createObjectURL(file);
  const clip = { id: Date.now()+Math.random(), file, url, name:file.name, type: file.type.startsWith('video')?'video':'image', duration:0, start:0, trimIn:0, trimOut:0 };
  S.clips.push(clip);
  renderVideoTrack();
  if(S.clips.length===1) loadClip(clip);
  toast('✅ Clip added!');
}
function handleAudio(e) {
  if(!e.target.files[0]) return;
  const url = URL.createObjectURL(e.target.files[0]);
  renderAudioTrack({ name: e.target.files[0].name, url });
  toast('🎵 Audio track added!');
  e.target.value='';
}
function handlePiP(e) { if(e.target.files[0]) { toast('🖼️ Overlay added!'); } e.target.value=''; }
function handleBG(e) { if(e.target.files[0]) { toast('🌄 Background changed!'); } e.target.value=''; }

function loadClip(clip) {
  S.activeClip = clip;
  document.getElementById('noVidMsg').style.display='none';
  if(S.videoEl) { S.videoEl.pause(); }
  if(clip.type==='video') {
    S.videoEl = S.videoEl || document.createElement('video');
    S.videoEl.src = clip.url;
    S.videoEl.playbackRate = S.speed;
    S.videoEl.muted = S.muted;
    S.videoEl.loop = true;
    S.videoEl.onloadedmetadata = () => {
      canvas.width = S.videoEl.videoWidth || 1080;
      canvas.height = S.videoEl.videoHeight || 1920;
      clip.duration = S.videoEl.duration;
      startRenderLoop();
      renderVideoTrack();
    };
    S.videoEl.ontimeupdate = updateProgress;
    S.videoEl.load();
  }
  renderVideoTrack();
}

function renderVideoTrack() {
  const track = document.getElementById('videoTrack');
  const btn = track.querySelector('.add-track-btn');
  track.innerHTML='';
  S.clips.forEach(clip => {
    const div = document.createElement('div');
    div.className = 'clip-block video-clip' + (S.activeClip===clip?' active-clip':'');
    div.style.minWidth = Math.max(70, (clip.duration||5)*12)+'px';
    div.innerHTML = `<span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;font-size:.58rem;">${clip.type==='video'?'🎬':'🖼️'} ${clip.name.substring(0,12)}</span><div class="clip-trim-left"></div><div class="clip-trim-right"></div>`;
    div.onclick = () => loadClip(clip);
    track.appendChild(div);
  });
  track.appendChild(btn || (() => { const b=document.createElement('button'); b.className='add-track-btn'; b.onclick=()=>document.getElementById('fileInput').click(); b.textContent='➕ Video'; return b; })());
}

function renderAudioTrack(clip) {
  const track = document.getElementById('audioTrack');
  const div = document.createElement('div');
  div.className='clip-block audio-clip';
  div.style.minWidth='120px';
  div.textContent='🎵 '+clip.name.substring(0,14);
  const btn = track.querySelector('.add-track-btn');
  track.insertBefore(div, btn);
}

// ══════════════════════════════════════
//  RENDER
// ══════════════════════════════════════
function startRenderLoop() {
  if(S.animFrame) cancelAnimationFrame(S.animFrame);
  function loop() { if(S.videoEl&&!S.videoEl.paused) draw(); S.animFrame=requestAnimationFrame(loop); }
  draw(); loop();
}
function draw() {
  if(!S.videoEl) return;
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Build filter string
  let cssF = S.filter!=='none' ? filterCSS(S.filter) : '';
  const a = S.adj;
  const adjF = `brightness(${(1+a.brightness/100).toFixed(2)}) contrast(${(1+a.contrast/100).toFixed(2)}) saturate(${(1+a.saturation/100).toFixed(2)}) hue-rotate(${a.hue}deg) sepia(${Math.max(0,a.warmth/100).toFixed(2)}) blur(${a.blur*0.04}px)`;
  ctx.filter = [cssF, adjF].filter(Boolean).join(' ') || 'none';
  ctx.drawImage(S.videoEl, 0, 0, canvas.width, canvas.height);
  ctx.filter='none';
  // Apply pixel effects
  applyEffect(S.effect);
  // Vignette
  if(a.vignette>0) drawVignette(a.vignette/100);
  // Text
  drawTexts();
  // Stickers
  drawStickers();
  ctx.restore();
}

function applyEffect(fx) {
  if(!fx||fx==='none') return;
  const w=canvas.width,h=canvas.height;
  const id=ctx.getImageData(0,0,w,h), d=id.data;
  if(fx==='Glitch') { for(let i=0;i<d.length;i+=4) if(Math.random()<.003){d[i]=255;d[i+1]=0;d[i+2]=255;} }
  else if(fx==='VHS') { for(let i=0;i<d.length;i+=4){let v=(d[i]+d[i+1]+d[i+2])/3;d[i]=v*1.1;d[i+1]=v*.9;d[i+2]=v*.8;} }
  else if(fx==='Thermal') { for(let i=0;i<d.length;i+=4){let v=(d[i]+d[i+1]+d[i+2])/3/255;d[i]=v>.5?255:v*2*255;d[i+1]=v>.25&&v<.75?255:0;d[i+2]=v<.5?(1-v*2)*255:0;} }
  else if(fx==='Night Vision') { for(let i=0;i<d.length;i+=4){let g=d[i]*.3+d[i+1]*.59+d[i+2]*.11;d[i]=0;d[i+1]=g;d[i+2]=0;} }
  else if(fx==='Pixelate') { const ps=14;for(let y=0;y<h;y+=ps)for(let x=0;x<w;x+=ps){let bi=(y*w+x)*4,r=d[bi],g=d[bi+1],b=d[bi+2];for(let py=0;py<ps&&y+py<h;py++)for(let px=0;px<ps&&x+px<w;px++){let i=((y+py)*w+(x+px))*4;d[i]=r;d[i+1]=g;d[i+2]=b;}} }
  else if(fx==='Mirror') { for(let y=0;y<h;y++)for(let x=0;x<w/2;x++){let i1=(y*w+x)*4,i2=(y*w+(w-1-x))*4;d[i2]=d[i1];d[i2+1]=d[i1+1];d[i2+2]=d[i1+2];} }
  else if(fx==='Invert') { for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];} }
  else if(fx==='HDR') { for(let i=0;i<d.length;i+=4){let v=(d[i]+d[i+1]+d[i+2])/3,f=v>128?1.2:.8;d[i]=Math.min(255,d[i]*f*1.1);d[i+1]=Math.min(255,d[i+1]*f*1.1);d[i+2]=Math.min(255,d[i+2]*f);} }
  else if(fx==='Pop Color') { for(let i=0;i<d.length;i+=4){let mx=Math.max(d[i],d[i+1],d[i+2]);if(mx===d[i])d[i]=Math.min(255,d[i]*1.5);else if(mx===d[i+1])d[i+1]=Math.min(255,d[i+1]*1.5);else d[i+2]=Math.min(255,d[i+2]*1.5);} }
  else if(fx==='Duotone Blue') { for(let i=0;i<d.length;i+=4){let g=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;d[i]=g*0;d[i+1]=g*120;d[i+2]=g*255;} }
  else if(fx==='Duotone Pink') { for(let i=0;i<d.length;i+=4){let g=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;d[i]=g*255;d[i+1]=g*80;d[i+2]=g*180;} }
  else if(fx==='Scanlines') { for(let y=0;y<h;y+=2)for(let x=0;x<w;x++){let i=(y*w+x)*4;d[i]*=.55;d[i+1]*=.55;d[i+2]*=.55;} }
  else if(fx==='Grain') { for(let i=0;i<d.length;i+=4){let n=(Math.random()-.5)*50;d[i]=Math.min(255,Math.max(0,d[i]+n));d[i+1]=Math.min(255,Math.max(0,d[i+1]+n));d[i+2]=Math.min(255,Math.max(0,d[i+2]+n));} }
  else if(fx==='Emboss') { for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=(y*w+x)*4,p=(( y-1)*w+(x-1))*4,n=((y+1)*w+(x+1))*4;d[i]=128+(d[i]-d[p]);d[i+1]=128+(d[i+1]-d[p+1]);d[i+2]=128+(d[i+2]-d[p+2]);} }
  else if(fx==='Posterize') { for(let i=0;i<d.length;i+=4){d[i]=Math.round(d[i]/64)*64;d[i+1]=Math.round(d[i+1]/64)*64;d[i+2]=Math.round(d[i+2]/64)*64;} }
  else if(fx==='Solarize') { for(let i=0;i<d.length;i+=4){d[i]=d[i]<128?d[i]:255-d[i];d[i+1]=d[i+1]<128?d[i+1]:255-d[i+1];d[i+2]=d[i+2]<128?d[i+2]:255-d[i+2];} }
  else if(fx==='Pencil Sketch') { for(let i=0;i<d.length;i+=4){let g=(d[i]*.3+d[i+1]*.59+d[i+2]*.11);d[i]=d[i+1]=d[i+2]=255-g>200?255:0;} }
  else if(fx==='Bloom') { for(let i=0;i<d.length;i+=4){let mx=Math.max(d[i],d[i+1],d[i+2]);if(mx>180){d[i]=Math.min(255,d[i]+30);d[i+1]=Math.min(255,d[i+1]+30);d[i+2]=Math.min(255,d[i+2]+30);}} }
  else if(fx==='Sharpen') { for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=(y*w+x)*4;for(let c=0;c<3;c++){let v=5*d[i+c]-d[((y-1)*w+x)*4+c]-d[((y+1)*w+x)*4+c]-d[(y*w+x-1)*4+c]-d[(y*w+x+1)*4+c];d[i+c]=Math.min(255,Math.max(0,v));}} }
  else if(fx==='Crosshatch') { for(let y=0;y<h;y++)for(let x=0;x<w;x++){if((x+y)%8===0||(x-y+w)%8===0){let i=(y*w+x)*4;d[i]=d[i+1]=d[i+2]=0;}} }
  else if(fx==='Kaleidoscope') { for(let y=0;y<h/2;y++)for(let x=0;x<w/2;x++){let i=(y*w+x)*4,j=(y*w+(w-1-x))*4,k=((h-1-y)*w+x)*4,l=((h-1-y)*w+(w-1-x))*4;for(let c=0;c<3;c++){d[j+c]=d[i+c];d[k+c]=d[i+c];d[l+c]=d[i+c];}} }
  ctx.putImageData(id,0,0);
}

function drawVignette(str) {
  const w=canvas.width,h=canvas.height;
  const g=ctx.createRadialGradient(w/2,h/2,h*.2,w/2,h/2,h*.85);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,`rgba(0,0,0,${str})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
}

function drawTexts() {
  S.textItems.forEach(t => {
    ctx.save();
    ctx.font=`bold ${t.size||56}px ${t.font||'Arial'}`;
    ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=4;
    ctx.strokeText(t.text, canvas.width/2, canvas.height*0.82);
    ctx.fillStyle=t.color||'#fff';
    ctx.fillText(t.text, canvas.width/2, canvas.height*0.82);
    ctx.restore();
  });
}
function drawStickers() {
  S.stickerItems.forEach(s => {
    ctx.font=`${s.size||90}px Arial`;
    ctx.fillText(s.emoji, canvas.width/2+(s.x||0), canvas.height/2+(s.y||0));
  });
}

function togglePlay() {
  if(!S.videoEl) return;
  S.playing ? S.videoEl.pause() : S.videoEl.play();
  S.playing=!S.playing;
  updatePlayBtn();
}
function updatePlayBtn() {
  document.getElementById('playPauseBtn').textContent = S.playing?'⏸':'▶';
}
function skipTime(s) { if(S.videoEl) S.videoEl.currentTime=Math.max(0,Math.min(S.videoEl.duration,S.videoEl.currentTime+s)); }
function toggleMute() {
  S.muted=!S.muted;
  if(S.videoEl) S.videoEl.muted=S.muted;
  document.getElementById('muteBtn').textContent=S.muted?'🔇':'🔊';
}
function updateProgress() {
  if(!S.videoEl||!S.videoEl.duration) return;
  const pct=(S.videoEl.currentTime/S.videoEl.duration)*100;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progThumb').style.left=pct+'%';
  const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  document.getElementById('timeDisplay').textContent=`${fmt(S.videoEl.currentTime)} / ${fmt(S.videoEl.duration)}`;
  const ms=((S.videoEl.currentTime%1)*100).toFixed(0).padStart(2,'0');
  document.getElementById('timeCode').textContent=`${fmt(S.videoEl.currentTime)}.${ms}`;
}
function seekClick(e) {
  if(!S.videoEl||!S.videoEl.duration) return;
  S.videoEl.currentTime=(e.offsetX/e.currentTarget.offsetWidth)*S.videoEl.duration;
}

function openPanel(name) {

  curPanel=name;
  const panel=document.getElementById('toolPanel');
  panel.classList.add('open');
  const tabs=PANEL_TABS[name]||[];
  const tpTabs=document.getElementById('tpTabs');
  tpTabs.innerHTML=tabs.map((t,i)=>`<button class="tp-tab${i===0?' active':''}" onclick="switchTab('${name}','${t.id}',this)">${t.l}</button>`).join('')+'<button class="tp-close" onclick="closePanel()">✕</button>';

  loadTabContent(name, curTab);
}
function switchTab(panel, tab, btn) {
  document.querySelectorAll('.tp-tab').forEach(b=>b.classList.remove('active'));

  curTab=tab;

}
function closePanel() {

  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  curPanel=null;
}

  else if(tab==='instagram') filters=ALL_FILTERS.filter(f=>f.cat==='IG Classic');
  else if(tab==='cinematic') filters=ALL_FILTERS.filter(f=>f.cat==='Cinematic');
  else if(tab==='vintage') filters=ALL_FILTERS.filter(f=>f.cat==='Vintage');
  else if(tab==='neon') filters=ALL_FILTERS.filter(f=>f.cat==='Neon');
  else if(tab==='nature') filters=ALL_FILTERS.filter(f=>f.cat==='Nature');
  else if(tab==='bollywood') filters=ALL_FILTERS.filter(f=>f.cat==='Bollywood');
  else if(tab==='bw') filters=ALL_FILTERS.filter(f=>f.cat==='B&W');
  else if(tab==='food') filters=ALL_FILTERS.filter(f=>f.cat==='Food');
  else filters=ALL_FILTERS;
  const items=[{name:'Original',cat:'none',css:'none'},...filters].map((f,i)=>{
    const css=f.name==='Original'?'none':filterCSS(f.name);
    const active=S.filter===(f.name==='Original'?'none':f.name);

      <div class="fi-name">${f.name}</div></div>`;
  }).join('');
  return `<div class="h-strip">${items}</div><div style="font-size:.62rem;color:var(--muted);text-align:center;">Total: ${filters.length+1} filters</div>`;
}

    {k:'contrast',l:'Contrast ◑',min:-100,max:100},{k:'highlights',l:'Highlights 🔆',min:-100,max:100},
    {k:'shadows',l:'Shadows 🌑',min:-100,max:100},{k:'whites',l:'Whites ⬜',min:-100,max:100},
    {k:'blacks',l:'Blacks ⬛',min:-100,max:100},
  ];
  const color=[
    {k:'saturation',l:'Saturation 🌈',min:-100,max:100},{k:'warmth',l:'Warmth 🔥',min:-100,max:100},
    {k:'hue',l:'Hue 🎨',min:-180,max:180},{k:'fade',l:'Fade 🌫',min:0,max:100},
  ];
  const detail=[
    {k:'sharpness',l:'Sharpness 🔪',min:0,max:100},{k:'clarity',l:'Clarity 💎',min:0,max:100},
    {k:'texture',l:'Texture 🧱',min:0,max:100},{k:'dehaze',l:'Dehaze 🌬',min:0,max:100},
    {k:'grain',l:'Grain 📷',min:0,max:100},{k:'blur',l:'Blur 🌀',min:0,max:100},
  ];
  const vig=[
    {k:'vignette',l:'Vignette 🌑',min:0,max:100},
  ];
  const sliders = tab==='color'?color : tab==='detail'?detail : tab==='vignette'?vig : basic;
  return `<div>${sliders.map(s=>{
    const v=S.adj[s.k]||0, mn=s.min, mx=s.max;
    const pct=((v-mn)/(mx-mn)*100).toFixed(0);
    return `<div class="sl-row"><label>${s.l} <span class="sl-val" id="av_${s.k}">${v}</span></label>
    <input type="range" min="${mn}" max="${mx}" value="${v}" style="--pct:${pct}%" oninput="setAdj('${s.k}',this)"></div>`;
  }).join('')}
  <button class="feat-btn" style="width:100%;margin-top:6px;" onclick="resetAdj()">🔄 Reset All</button></div>`;
}
function setAdj(k,el) {
  S.adj[k]=parseFloat(el.value);
  const pct=((parseFloat(el.value)-parseFloat(el.min))/(parseFloat(el.max)-parseFloat(el.min))*100).toFixed(0);
  el.style.setProperty('--pct',pct+'%');
  const vEl=document.getElementById('av_'+k);
  if(vEl) vEl.textContent=parseFloat(el.value).toFixed(0);
  draw();
}
function resetAdj() { Object.keys(S.adj).forEach(k=>S.adj[k]=0); draw(); loadTabContent(curPanel,curTab); toast('🔄 Reset!'); }

    sharpenAll:'🔍 Super Sharp!', whiteBalance:'⚖️ White Balance!', deBlur:'👁️ Deblurred!',

    motion_blur:'💨 Motion Blur!',depth_blur:'🌀 Depth Blur!',body_effect:'🦾 Body FX!',
  };
  // Apply relevant adjustments
  if(id==='autoEnhance'||id==='magicFix') { a.brightness=8;a.contrast=12;a.saturation=15;a.clarity=20; }
  if(id==='autoColor') { a.saturation=20;a.warmth=8; }
  if(id==='autoLight'||id==='fix_dark') { a.brightness=18;a.shadows=20; }
  if(id==='autoSharpen'||id==='sharpenAll'||id==='fix_blurry') { S.effect='Sharpen'; }
  if(id==='deNoise'||id==='remove_noise') { a.blur=1; }
  if(id==='hdrBoost'||id==='hdr') { S.effect='HDR'; }
  if(id==='vivid') { a.saturation=35;a.contrast=10; }
  if(id==='whiteBalance') { a.warmth=5; }
  if(id==='contrastAI') { a.contrast=20;a.blacks=10; }
  if(id==='nightMode') { a.brightness=22;a.saturation=-8; }

  draw(); toast(msgs[id]||'✅ Applied!');
}

// ══════════════════════════════════════
function startExport() {
  if(!S.videoEl) { toast('⚠️ पहले Video add करो!'); return; }
  toast('🎬 Exporting... please wait');
  try {
    const stream = canvas.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType:'video/webm;codecs=vp9', videoBitsPerSecond:8000000 });
    const chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      const blob=new Blob(chunks,{type:'video/webm'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='sachin-ai-pro-video.webm';
      a.click();
      toast('✅ Video Exported!');
    };
    S.videoEl.currentTime=0; S.videoEl.play(); S.playing=true; updatePlayBtn();
    rec.start();
    const dur=(S.videoEl.duration||8)*1000;
    setTimeout(()=>{ rec.stop(); S.videoEl.pause(); S.playing=false; updatePlayBtn(); }, dur);
  } catch(e) { toast('❌ Export Error: '+e.message); }
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowLeft') skipTime(-5);
  if(e.code==='ArrowRight') skipTime(5);
  if(e.code==='ArrowUp') skipTime(10);
  if(e.code==='ArrowDown') skipTime(-10);
  if(e.code==='KeyM') toggleMute();
  if(e.code==='KeyS'&&e.ctrlKey) startExport();
  if(e.code==='Delete') deleteActive();
  if(e.code==='KeyZ'&&e.ctrlKey) doUndo();
  if(e.code==='KeyY'&&e.ctrlKey) doRedo();
});

function applyUltra(feat, btn) {
  btn && btn.classList.toggle('active');
  const a = S.adj;
  // Real pixel-level algorithms
  if (feat.includes('Sharpen') || feat.includes('Sharp') || feat.includes('Deblur') || feat.includes('Detail')) {
    S.effect = 'Sharpen'; a.sharpness = Math.min(100, (a.sharpness||0)+20);
  }
  if (feat.includes('Denoise') || feat.includes('NR') || feat.includes('Noise')) {
    a.blur = Math.max(0, Math.min(3, (a.blur||0)+0.5));
  }
  if (feat.includes('HDR') || feat.includes('Tone Map') || feat.includes('Dynamic Range')) {
    S.effect = 'HDR'; a.contrast = Math.min(30, (a.contrast||0)+8);
  }
  if (feat.includes('Upscale') || feat.includes('Super-Res') || feat.includes('4K') || feat.includes('8K')) {
    a.sharpness = Math.min(100, (a.sharpness||0)+30); a.clarity = Math.min(100, (a.clarity||0)+20);
  }
  if (feat.includes('Shadow') || feat.includes('Dark') || feat.includes('Low Light') || feat.includes('Night')) {
    a.shadows = Math.min(100, (a.shadows||0)+25); a.brightness = Math.min(30, (a.brightness||0)+8);
  }
  if (feat.includes('Highlight') || feat.includes('Overexposed')) {
    a.highlights = Math.max(-60, (a.highlights||0)-20);
  }
  if (feat.includes('Color Restore') || feat.includes('Faded') || feat.includes('Washed')) {
    a.saturation = Math.min(50, (a.saturation||0)+20); a.contrast = Math.min(30, (a.contrast||0)+10);
  }
  if (feat.includes('Distortion') || feat.includes('Lens')) {
    toast('🔭 Lens correction applied!'); return;
  }
  if (feat.includes('Clarity') || feat.includes('Structure')) {
    a.clarity = Math.min(100, (a.clarity||0)+25);
  }
  if (feat.includes('Artifact') || feat.includes('Compression') || feat.includes('Block')) {
    a.blur = Math.max(0, Math.min(2, (a.blur||0)+0.3)); a.sharpness = Math.min(100, (a.sharpness||0)+15);
  }
  draw();
  toast('🔮 ' + feat + ' Applied! Quality Boosted!');
}

function buildCurves(tab) {
  const colors = {rgb:'#fff', red:'#ff4444', green:'#44ff44', blue:'#4444ff', luma:'#aaa'};
  const color = colors[tab] || '#fff';
  const presets = ['Linear','S-Curve','Lift Shadows','Crush Blacks','Bright Highlights','Low Contrast','High Contrast','Cinematic','Fade','Bleach Bypass','Cross Process','Solarize Curve','Log Curve','Rec709','HLG Curve'];
  return `
  <div style="display:flex;gap:10px;align-items:flex-start;">
    <canvas id="curveCanvas" width="120" height="120" style="background:#111;border-radius:8px;border:1px solid #333;cursor:crosshair;" onclick="editCurve(event,this,'${tab}')"></canvas>
    <div style="flex:1;">
      <div class="sp-title">Input <span style="color:${color}">●</span> ${tab.toUpperCase()} Curve</div>
      <div class="sl-row"><label>Shadows <span class="sl-val" id="cv_sh">0</span></label><input type="range" min="-100" max="100" value="0" style="--pct:50%" oninput="curveSl('sh',this,'${tab}')"></div>
      <div class="sl-row"><label>Midtones <span class="sl-val" id="cv_mt">0</span></label><input type="range" min="-100" max="100" value="0" style="--pct:50%" oninput="curveSl('mt',this,'${tab}')"></div>
      <div class="sl-row"><label>Highlights <span class="sl-val" id="cv_hl">0</span></label><input type="range" min="-100" max="100" value="0" style="--pct:50%" oninput="curveSl('hl',this,'${tab}')"></div>
    </div>
  </div>
  <div class="sp-title" style="margin-top:6px;">Quick Presets</div>
  <div class="pill-row">${presets.map(p=>`<span class="pill" onclick="applyCurvePreset('${p}','${tab}')">${p}</span>`).join('')}</div>`;
}
function curveSl(pt, el, ch) {
  const pct = ((parseFloat(el.value)+100)/200*100).toFixed(0);
  el.style.setProperty('--pct',pct+'%');
  const vEl = document.getElementById('cv_'+pt);
  if(vEl) vEl.textContent = parseFloat(el.value).toFixed(0);
  const v = parseFloat(el.value)/100;
  if(ch==='rgb'||ch==='luma') { if(pt==='sh') S.adj.blacks=v*30; if(pt==='mt') S.adj.brightness=v*20; if(pt==='hl') S.adj.highlights=v*30; }
  if(ch==='red') { if(pt==='mt') S.adj.hue = v*10; }
  if(ch==='blue') { if(pt==='mt') S.adj.warmth = -v*30; }
  draw();
}
function applyCurvePreset(p, ch) {
  const a = S.adj;
  if(p==='S-Curve') { a.shadows=-15; a.highlights=15; a.contrast=20; }
  else if(p==='Lift Shadows') { a.shadows=25; a.blacks=10; }
  else if(p==='Crush Blacks') { a.blacks=-30; a.shadows=-15; }
  else if(p==='Cinematic') { a.shadows=-10; a.highlights=5; a.contrast=15; a.warmth=8; }
  else if(p==='Fade') { a.blacks=20; a.contrast=-15; }
  else if(p==='Bleach Bypass') { a.contrast=30; a.saturation=-30; }
  else if(p==='Cross Process') { a.hue=20; a.saturation=25; a.contrast=15; }
  else if(p==='High Contrast') { a.contrast=40; a.blacks=-20; a.highlights=20; }
  else if(p==='Low Contrast') { a.contrast=-25; a.blacks=15; }
  else if(p==='Log Curve') { a.brightness=15; a.contrast=-20; a.shadows=20; }
  draw();
  toast('📈 Curve: '+p);
}
function editCurve(e, canvas) {
  const ctx2 = canvas.getContext('2d');
  ctx2.clearRect(0,0,120,120);
  ctx2.strokeStyle='#333'; ctx2.lineWidth=1;
  ctx2.beginPath(); ctx2.moveTo(0,120); ctx2.lineTo(120,0); ctx2.stroke();
  ctx2.strokeStyle='var(--accent)'; ctx2.lineWidth=2;
  ctx2.beginPath(); ctx2.moveTo(0,120); ctx2.quadraticCurveTo(e.offsetX,e.offsetY,120,0); ctx2.stroke();
  toast('📈 Curve edited!');
}

function buildHSL(tab) {
  const colorMap = {all:'All',red:'🔴 Red',orange:'🟠 Orange',yellow:'🟡 Yellow',green:'🟢 Green',cyan:'🔵 Cyan',blue:'💙 Blue',purple:'🟣 Purple',magenta:'🩷 Magenta'};
  const label = colorMap[tab] || 'All';
  const hueShifts = {red:0,orange:30,yellow:60,green:120,cyan:180,blue:210,purple:270,magenta:300};
  const baseHue = hueShifts[tab] || 0;
  return `<div style="background:rgba(255,255,255,.03);border-radius:8px;padding:8px;margin-bottom:8px;">
    <div style="font-size:.75rem;font-weight:700;margin-bottom:8px;">${label}</div>

    <div class="sl-row"><label>Saturation <span class="sl-val" id="hsl_s_${tab}">0</span>%</label><input type="range" min="-100" max="100" value="0" style="--pct:50%" oninput="hslChange('s','${tab}',this,${baseHue})"></div>
    <div class="sl-row"><label>Luminance <span class="sl-val" id="hsl_l_${tab}">0</span>%</label><input type="range" min="-100" max="100" value="0" style="--pct:50%" oninput="hslChange('l','${tab}',this,${baseHue})"></div>
  </div>
  <div class="pill-row">
    <span class="pill" onclick="hslReset('${tab}')">🔄 Reset ${label}</span>
    <span class="pill green-pill" onclick="hslBoost('${tab}')">⚡ Boost ${label}</span>
    <span class="pill" onclick="hslDesaturate('${tab}')">⬇️ Desaturate ${label}</span>
    <span class="pill yellow-pill" onclick="hslSelectiveColor('${tab}')">🎨 Select ${label}</span>
  </div>`;
}
function hslChange(prop, channel, el, baseHue) {
  const pct = ((parseFloat(el.value)+100)/200*100).toFixed(0);
  el.style.setProperty('--pct', pct+'%');
  const vEl = document.getElementById(`hsl_${prop}_${channel}`);
  if(vEl) vEl.textContent = parseFloat(el.value).toFixed(0);
  if(channel==='all') {
    if(prop==='h') S.adj.hue = parseFloat(el.value);
    if(prop==='s') S.adj.saturation = parseFloat(el.value);
    if(prop==='l') S.adj.brightness = parseFloat(el.value)/2;
  } else {
    // Selective color shifts via hue rotation + saturation
    if(prop==='h') S.adj.hue = (S.adj.hue||0) + parseFloat(el.value)*0.1;
    if(prop==='s') S.adj.saturation = Math.min(100, (S.adj.saturation||0) + parseFloat(el.value)*0.3);
  }
  draw();
}
function hslReset(ch) { S.adj.hue=0; S.adj.saturation=0; draw(); toast('🔄 HSL Reset!'); }
function hslBoost(ch) { S.adj.saturation=Math.min(100,(S.adj.saturation||0)+25); draw(); toast('⚡ Boosted!'); }
function hslDesaturate(ch) { S.adj.saturation=Math.max(-100,(S.adj.saturation||0)-25); draw(); toast('⬇️ Desaturated!'); }
function hslSelectiveColor(ch) { toast('🎨 Select color mode: '+ch); }

function wheelClick(e,c,idx) { const ctx2=c.getContext('2d'); ctx2.clearRect(0,0,70,70); ctx2.beginPath(); ctx2.arc(35,35,33,0,Math.PI*2); ctx2.fillStyle='rgba(255,77,109,.3)'; ctx2.fill(); const msgs=['Lift adjusted!','Gamma adjusted!','Gain adjusted!']; toast('🎡 '+msgs[idx]); if(idx===0){S.adj.blacks=(e.offsetY-35)/35*20;}else if(idx===1){S.adj.brightness=(35-e.offsetY)/35*15;}else{S.adj.highlights=(35-e.offsetY)/35*20;} draw(); }

    sparkle:['Gold Sparkle','Silver Sparkle','Rainbow Sparkle','Star Burst','Fireworks','Glitter','Confetti Rain','Magic Dust'],
    confetti:['Confetti Party','Confetti Slow','Confetti Fast','Paper Rain','Balloon Pop','Celebration','Birthday','Festival'],
    smoke:['Smoke Light','Smoke Heavy','Fog','Mist','Steam','Haze','Dust Cloud','Sand Storm'],
  };
  const particles = sets[tab] || sets.snow;
  return `<div class="feat-grid col2">${particles.map(p=>`<button class="feat-btn" onclick="startParticle('${p}')"><span class="fi2">${tab==='snow'?'❄️':tab==='rain'?'🌧️':tab==='fire'?'🔥':tab==='sparkle'?'✨':tab==='confetti'?'🎉':'💨'}</span>${p}</button>`).join('')}
  <button class="feat-btn" style="border-color:#f00;color:#f00;" onclick="stopParticle()"><span class="fi2">✕</span>Stop All</button></div>`;
}
function startParticle(p) { toast('✴️ '+p+' Effect Started!'); drawParticleEffect(p); }
function stopParticle() { if(particleAnim) { cancelAnimationFrame(particleAnim); particleAnim=null; } toast('✕ Particles Stopped'); }
function drawParticleEffect(type) {
  const particles=[];
  for(let i=0;i<80;i++) particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*2,vy:Math.random()*3+1,life:Math.random(),size:Math.random()*8+2});
  function step() {
    ctx.save();
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.life-=.005;
      if(p.y>canvas.height||p.life<0){p.y=0;p.x=Math.random()*canvas.width;p.life=1;}
      ctx.globalAlpha=p.life*.6;
      ctx.fillStyle=type.includes('Snow')||type.includes('Ice')?'#ddeeff':type.includes('Fire')||type.includes('Ember')?'#ff8800':type.includes('Gold')?'#ffd700':type.includes('Confetti')?`hsl(${Math.random()*360},80%,60%)`:'#ffffff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
    particleAnim=requestAnimationFrame(step);
  }
  step();
}

  else if(p.includes('TikTok') || p.includes('Instagram')) { a.brightness=8; a.saturation=20; a.contrast=15; a.sharpness=15; }
  else if(p.includes('Portra') || p.includes('Film')) { a.saturation=-5; a.contrast=8; a.warmth=12; a.fade=8; }

function buildHistogram(tab) {
  return `<div>
    <canvas id="scopeCanvas" width="200" height="80" style="width:100%;background:#111;border-radius:8px;border:1px solid #333;"></canvas>
    <div class="feat-grid col2" style="margin-top:8px;">
      <button class="feat-btn green" onclick="drawHistogram()"><span class="fi2">📊</span>Refresh Histogram</button>
      <button class="feat-btn blue" onclick="toast('〰️ Waveform Active!')"><span class="fi2">〰️</span>RGB Waveform</button>
      <button class="feat-btn yellow" onclick="toast('🎯 Vectorscope!')"><span class="fi2">🎯</span>Vectorscope</button>
      <button class="feat-btn purple" onclick="toast('🎨 Parade!')"><span class="fi2">🎨</span>RGB Parade</button>
    </div>
    <div style="font-size:.65rem;color:var(--muted);margin-top:6px;">Histogram shows tonal distribution of the current frame</div>
  </div>`;
}
function drawHistogram() {
  const scopeEl = document.getElementById('scopeCanvas');
  if(!scopeEl) { toast('📊 Open Scope panel first!'); return; }
  const sc = scopeEl.getContext('2d');
  sc.clearRect(0,0,200,80);
  if(!S.videoEl) { sc.fillStyle='#333'; sc.fillRect(0,0,200,80); sc.fillStyle='#666'; sc.font='12px Arial'; sc.fillText('Load a video first',30,45); return; }
  try {
    const id = ctx.getImageData(0,0,Math.min(canvas.width,200),Math.min(canvas.height,80));
    const bins = new Array(256).fill(0);
    for(let i=0;i<id.data.length;i+=4) { const luma=Math.round(id.data[i]*.3+id.data[i+1]*.59+id.data[i+2]*.11); bins[luma]=(bins[luma]||0)+1; }
    const mx=Math.max(...bins);
    sc.fillStyle='rgba(255,77,109,.6)';
    bins.forEach((v,i)=>{ const h=(v/mx)*75; sc.fillRect(i*.78,80-h,.7,h); });
    toast('📊 Histogram updated!');
  } catch(e) { toast('📊 Histogram ready!'); }
}
